<body>
<title>Producción Dental Delaware</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: three big screens behind three big tabs. Dentist: today's patients on the left, the selected patient on the right. Big targets, few words. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --sunk:#eef2f7; --ink:#1b2433; --muted:#5c6b80; --line:#dfe5ee;
  --nav:#1d2939; --nav-ink:#c9d3e0;
  --primary:#0f62d6; --primary-ink:#ffffff; --primary-soft:#e6effd;
  --go:#14794b; --go-ink:#ffffff;
  --ok:#14794b; --ok-soft:#e0f3e8; --warn:#9a5800; --warn-soft:#fcefd9; --bad:#bf2f26; --bad-soft:#fce4e1;
  --font-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343;
  --nav:#0a0f15; --nav-ink:#93a1b4;
  --primary:#7aa2ff; --primary-ink:#0a1020; --primary-soft:#1a2646;
  --go:#4cc28a; --go-ink:#06140d;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343;
  --nav:#0a0f15; --nav-ink:#93a1b4;
  --primary:#7aa2ff; --primary-ink:#0a1020; --primary-soft:#1a2646;
  --go:#4cc28a; --go-ink:#06140d;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

header.top{background:var(--nav);color:var(--nav-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:30px;height:30px;color:#ffffff;flex:none}
.logo b{display:block;color:#ffffff}
.logo span{font-size:.78rem}
.logo.brand .plate{background:#ffffff;border-radius:10px;padding:6px 10px;display:block}
.logo.brand img{display:block;height:30px;width:auto}
.tabs{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--nav-ink);font-weight:700;font-size:1.02rem;padding:10px 18px;border-radius:999px;display:flex;align-items:center;gap:8px}
.tab:hover{color:#ffffff}
.tab[aria-selected="true"]{background:#ffffff;color:var(--nav)}
.tab .cnt{font-family:var(--font-mono);font-size:.74rem;background:var(--bad);color:#ffffff;border-radius:999px;padding:1px 7px}
.lang{display:inline-flex;border:1px solid #3a4a60;border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:var(--nav-ink);padding:3px 10px;border-radius:999px;font-weight:700;font-size:.76rem}
.lang button[aria-pressed="true"]{background:#ffffff;color:var(--nav)}
.proto{font-size:.82rem;color:var(--muted);padding-block:10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.proto b{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:4px}
.linkbtn{border:0;background:none;padding:0;color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px}
main{padding-block:4px 56px}
.btn{border:0;background:var(--primary);color:var(--primary-ink);font-weight:700;padding:11px 18px;border-radius:10px;white-space:nowrap}
.btn.go{background:var(--go);color:var(--go-ink);font-size:1.1rem;padding:14px 22px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph h2{font-size:1.1rem}
.pb{padding:16px 18px;display:flex;flex-direction:column;gap:16px}

/* dentist */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.bar label{font-weight:700;display:flex;align-items:center;gap:8px}
.bar select{font-size:1.02rem;font-weight:700;min-width:220px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted)}
.day::first-letter{text-transform:uppercase}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dgrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.plist{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:6px}
.pbtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.pbtn:hover{border-color:var(--primary)}
.pbtn[aria-current="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary);background:var(--primary-soft)}
.pbtn .time{font-family:var(--font-mono);font-size:.84rem;color:var(--muted);width:44px;flex:none}
.pbtn .nm{flex:1;min-width:0}
.pbtn .nm b{display:block}
.pbtn .nm span{font-size:.8rem;color:var(--muted)}
.badge{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.badge.todo{background:var(--sunk);color:var(--muted)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.pt{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.pt h2{font-size:1.5rem}
.ins{font-size:.92rem}
.q{font-size:1.05rem;font-weight:700}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;font-size:1.05rem}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qb{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:64px}
.qb:hover{border-color:var(--primary);background:var(--primary-soft)}
.qb .c{font-family:var(--font-mono);font-weight:600;font-size:.86rem;color:var(--primary)}
.qb .n{font-size:.86rem}
.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.done-list li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.done-list .c{font-family:var(--font-mono);font-weight:600;width:60px}
.done-list .n{flex:1;min-width:140px}
.done-list input{width:70px;padding:6px 8px;font-family:var(--font-mono);text-align:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-weight:700;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.rm{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:1.15rem;line-height:1}
.rm:hover{background:var(--bad-soft);color:var(--bad)}
.saverow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.saved{color:var(--ok);font-weight:700}
.empty{color:var(--muted);padding:6px 0}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.9rem}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:640px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi span{display:block;font-size:.84rem;font-weight:700;color:var(--muted)}
.kpi b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.8rem}
.kpi.bad b{color:var(--bad)}
.kpi.good b{color:var(--ok)}
.tablewrap{overflow-x:auto}
table.plain{width:100%;border-collapse:collapse;font-size:.95rem}
.plain th{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.plain th.num{text-align:right}
.plain td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.plain tfoot td{font-weight:700;background:var(--sunk);border-bottom:0}
.plain .detail>td{background:var(--sunk)}
.inner{width:100%;border-collapse:collapse;font-size:.88rem}
.inner td{padding:6px 8px;border-bottom:1px solid var(--line)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--bad);font-size:.92rem}
.alerts li.warn{border-left-color:var(--warn)}
.okline{color:var(--ok);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}

/* fees */
.fees input{width:86px;text-align:right;font-family:var(--font-mono);padding:6px 8px;border-radius:8px}
.fees td{padding:6px 10px}
.fees td.code{font-family:var(--font-mono);font-weight:600;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=number]{width:80px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end;padding:12px;background:var(--sunk);border-radius:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.form input,.form select{width:100%}
.combos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.combos li{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.combos .codes{font-family:var(--font-mono)}
.hist{font-size:.86rem;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="logo brand">
      <span class="plate"><img src="brand/logo.png" width="777" height="149" alt="Southern Delaware Dental Specialists"></span>

  </div>
</header>

<main class="wrap" id="main"></main>

// codes → engine items; the same crown code is a different pay event at prep and at delivery
function engineItems(codes){
 const out=[];let pa=0,btw=0;
 codes.forEach(e=>{
  const ci=codeInfo(e.code);if(!ci){out.push({k:'other'});return;}
  const it=ci.item;
  if(it==='pa'||it==='paadd'){pa++;return;}
  if(/^btw\d$/.test(it)){btw=Math.min(4,btw+ +it.slice(3));return;}
  if(it==='crown'){out.push({k:e.stage==='seat'?'crowndel':'crownprep',tooth:e.tooth});return;}
  if(it==='implant'){out.push({k:e.stage==='seat'?'impldel':'implimp',tooth:e.tooth});return;}
  out.push({k:it,tooth:e.tooth});
 });
 if(btw)out.push({k:'btw',n:btw});
 if(pa)out.push({k:'pa',n:pa});
 return out;
}
function evalVisit(v){
 const p=pat(v.patient);const pl=p&&p.plan?planInfo(p.plan):null;
 const planKey=pl?(PD.PLANS[pl.id]?pl.id:PLAN_FOR_COL[pl.col]):null;
 const r=PD.priceVisit(engineItems(v.codes),planKey,{fees:S.fees,implantIdx:S.implantIdx});
 if(!v.codes.length)r.alerts=['empty'];
 r.blocking=r.alerts.filter(a=>BLOCKING.has(a)).length;
 const label=x=>{const it=PD.ITEM[x.id];return (it?it[S.lang]:x.id)+(x.qty>1?' ×'+x.qty:'');};
 r.missing=r.parts.filter(x=>x.amount==null&&!(PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable')).map(label);
 r.notIn=r.parts.filter(x=>PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable').map(label);
 return r;
}
function alertMsg(a,e){return a==='noIns'?t('a_noIns'):a==='noPrice'?t('a_noPrice',e.missing.join(', '),colName(e.col)):a==='notInTable'?t('a_notInTable',e.notIn.join(', ')):a==='twoPrices'?t('a_twoPrices'):t('a_empty');}

  ${PD.BUNDLES.map(b=>`<li><span class="codes">${esc(comboCodes(b))}</span><span>${esc(PD.ITEM[b.id][S.lang])}</span></li>`).join('')}
 </ul>
 <div class="tools"><span>${t('implantRule')}</span><span class="seg" role="group">${[0,1].map(i=>`<button type="button" data-action="implant" data-i="${i}" aria-pressed="${S.implantIdx===i}">${[508.4,406.4][i].toFixed(2)}</button>`).join('')}</span></div>
 <div><p style="font-weight:700;margin-bottom:4px">${t('histTitle')}</p><p class="hist">${S.history.length?S.history.map(esc).join(' · '):t('noHist')}</p></div></div></section>
 </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='lang'){S.lang=b.dataset.lang;save();render();}
 else if(a==='page')setPage(b.dataset.page);
 else if(a==='reset'){const lang=S.lang,page=S.page;S=seed();S.lang=lang;S.page=page;SAVED_AT=null;save();render();toast(t('resetDone'));}
 else if(a==='day'){S.date=b.dataset.d;S.sel=null;SAVED_AT=null;save();renderDentist();}
 else if(a==='sel'){S.sel=b.dataset.v;SAVED_AT=null;save();renderDentist();if(matchMedia('(max-width:860px)').matches)$('#ppanel').scrollIntoView({block:'start'});}
 else if(a==='quick')addCode(b.dataset.c);
 else if(a==='add-code'){addCode($('#code-in').value);}
 else if(a==='rm'){const v=curVisit();v.codes.splice(+b.dataset.i,1);v.saved=false;SAVED_AT=null;save();renderShell();refreshPanel(null);}
 else if(a==='stage'){const v=curVisit();v.codes[+b.dataset.i].stage=b.dataset.s;v.saved=false;save();refreshPanel(null);}
 else if(a==='save'){const v=curVisit();v.saved=true;SAVED_AT=v.id;const name=pat(v.patient).name;const next=dayVisits().find(x=>!x.saved&&x.id!==v.id);save();renderShell();renderDentist();toast(t('savedFor',name));if(next){setTimeout(()=>{if(S.sel===v.id&&S.page==='dentist'){S.sel=next.id;SAVED_AT=null;save();renderDentist();}},1400);}}
 else if(a==='toggle'){S.open[b.dataset.d]=!S.open[b.dataset.d];save();renderSummary();}
 else if(a==='adp'){const lines=['Dentist\tPay period\tAmount'];S.dentists.forEach(d=>{const tot=sum(S.visits.filter(v=>v.dentist===d.id&&v.codes.length).map(v=>evalVisit(v).total||0));lines.push(`${d.name}\t2026-10-12 to 2026-10-23\t${tot.toFixed(2)}`);});const ok=()=>toast(t('copied'));try{navigator.clipboard.writeText(lines.join('\n')).then(ok,ok);}catch(e){ok();}}
 else if(a==='form-code'){S.form={type:'code'};renderFees();$('#nc-code')?.focus();}
 else if(a==='form-plan'){S.form={type:'plan'};renderFees();$('#np-name')?.focus();}
 else if(a==='form-close'){S.form=null;renderFees();}
 else if(a==='save-code'){const code=$('#nc-code').value.trim().toUpperCase(),name=$('#nc-name').value.trim();if(!/^D\d{4}$/.test(code)||!name||codeInfo(code)){toast(t('badCode'));return;}const key='x_'+code;S.fees[key]={};PD.COLS.forEach(c=>{const v=$('#nc-'+c).value;S.fees[key][c]=v===''?null:+v;});S.customCodes.push({code,item:key,en:name,es:name,stage:false});S.form=null;save();renderFees();toast(t('codeAdded',code));}
 else if(a==='save-plan'){const name=$('#np-name').value.trim();if(!name)return;S.customPlans.push({id:'cp'+(S.customPlans.length+1),name,col:$('#np-col').value});S.form=null;save();renderFees();toast(t('planAdded',name));}
 else if(a==='raise'){const p=+$('#raise').value;if(!(p>0))return;const f=1+p/100;Object.values(S.fees).forEach(row=>Object.keys(row).forEach(c=>{const v=row[c];if(Array.isArray(v))row[c]=v.map(x=>Math.round(x*f*100)/100);else if(typeof v==='number'&&v>0)row[c]=Math.round(v*f*100)/100;}));S.history.unshift(`+${p}% · ${new Date().toLocaleDateString(t('locale'))}`);save();render();toast(t('raised',p));}
 else if(a==='implant'){S.implantIdx=+b.dataset.i;save();render();toast(t('saved'));}
});
document.addEventListener('change',ev=>{
 const el=ev.target,f=el.dataset.f;
 if(f==='dentist'){S.dentist=el.value;S.sel=null;SAVED_AT=null;save();renderDentist();}
 else if(f==='tooth'){const v=curVisit();const s=el.value.trim().toUpperCase().replace(/^#/,'');if(s)v.codes[+el.dataset.i].tooth=s;else delete v.codes[+el.dataset.i].tooth;v.saved=false;save();}
 else if(f==='fee'){const v=el.value.trim();S.fees[el.dataset.k][el.dataset.col]=v===''?null:Math.max(0,+v);save();renderShell();toast(t('saved'));}
 else if(el.id==='walkin'){const name=el.value.trim();const p=S.patients.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p)return;let v=S.visits.find(x=>x.dentist===S.dentist&&x.date===S.date&&x.patient===p.id);if(!v){v={id:'v'+(S.nextVisit++),date:S.date,dentist:S.dentist,patient:p.id,time:'—',codes:[],saved:false};S.visits.push(v);}S.sel=v.id;save();renderDentist();}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='code-in'){ev.preventDefault();addCode(ev.target.value);}});

const h=(location.hash||'').slice(1);if(PAGES.includes(h))S.page=h;
render();
})();
</script>

</body>
