<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Producción Dental Delaware</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: CRM shell. Dark sidebar, top bar with search and the main action, summary cards that double as filters, a record list, and a record side panel that opens on click. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --sunk:#eef2f7; --ink:#1b2433; --muted:#5c6b80; --line:#dfe5ee;
  --nav:#1d2939; --nav-ink:#b9c5d4; --nav-hi:#ffffff; --nav-active:#2d3d53;
  --primary:#0f62d6; --primary-ink:#ffffff; --primary-soft:#e6effd;
  --ok:#14794b; --ok-soft:#e0f3e8; --warn:#9a5800; --warn-soft:#fcefd9; --bad:#bf2f26; --bad-soft:#fce4e1;
  --av1:#dbe7fd; --av1i:#1d4ed8; --av2:#d4f1ea; --av2i:#0f766e; --av3:#ebe3fd; --av3i:#6d28d9; --av4:#fbebd3; --av4i:#9a5800; --av5:#fde2e7; --av5i:#be123c; --av6:#e3e8ef; --av6i:#334155;
  --scrim:rgba(15,23,35,.35);
  --font-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343;
  --nav:#0a0f15; --nav-ink:#93a1b4; --nav-hi:#ffffff; --nav-active:#1b2636;
  --primary:#7aa2ff; --primary-ink:#0a1020; --primary-soft:#1a2646;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  --av1:#1d2b4a; --av1i:#9db8ff; --av2:#123230; --av2i:#6fd6c4; --av3:#2a2145; --av3i:#c3a8ff; --av4:#33270f; --av4i:#f0b45c; --av5:#3a1a24; --av5i:#ff9db2; --av6:#232c38; --av6i:#b6c2d1;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343;
  --nav:#0a0f15; --nav-ink:#93a1b4; --nav-hi:#ffffff; --nav-active:#1b2636;
  --primary:#7aa2ff; --primary-ink:#0a1020; --primary-soft:#1a2646;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  --av1:#1d2b4a; --av1i:#9db8ff; --av2:#123230; --av2i:#6fd6c4; --av3:#2a2145; --av3i:#c3a8ff; --av4:#33270f; --av4i:#f0b45c; --av5:#3a1a24; --av5i:#ff9db2; --av6:#232c38; --av6i:#b6c2d1;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.8rem}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
select,input[type=text],input[type=search],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
select:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 8px}
.logo svg{width:30px;height:30px;color:var(--nav-hi);flex:none}
.logo b{display:block;color:var(--nav-hi);font-size:1rem}
.logo span{font-size:.76rem}
/* clinic logo (only in the Vercel build): the mark is taupe on transparent, so it sits on a white plate */
.logo.brand{flex-direction:column;align-items:stretch;gap:8px;padding:0 2px 6px}
.logo.brand .plate{background:#ffffff;border-radius:10px;padding:10px 12px;display:block}
.logo.brand img{display:block;width:100%;height:auto}
.logo.brand span[data-i18n]{padding-left:4px}
@media (max-width:900px){.logo.brand{flex-direction:row;align-items:center;padding:0}.logo.brand .plate{padding:6px 10px}.logo.brand img{width:auto;height:26px}}
.nav{display:flex;flex-direction:column;gap:2px}
.navi{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--nav-ink);padding:9px 10px;border-radius:8px;font-weight:700;text-align:left;width:100%}
.navi svg{width:19px;height:19px;flex:none}
.navi:hover{background:var(--nav-active);color:var(--nav-hi)}
.navi[aria-current="page"]{background:var(--nav-active);color:var(--nav-hi);box-shadow:inset 3px 0 0 var(--primary)}
.navi .cnt{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:.78rem;padding:0 8px}
.side-foot .proto{color:var(--nav-hi);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.68rem}
.side-foot button.link{border:0;background:none;padding:0;color:var(--nav-hi);text-decoration:underline;text-underline-offset:3px;text-align:left}
.lang{display:inline-flex;border:1px solid var(--nav-active);border-radius:999px;padding:2px;align-self:flex-start}
.lang button{border:0;background:none;color:var(--nav-ink);padding:3px 10px;border-radius:999px;font-weight:700;font-size:.75rem}
.lang button[aria-pressed="true"]{background:var(--nav-hi);color:var(--nav)}
.main{min-width:0;padding-block:20px 56px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
.topbar h1{font-size:1.45rem}
.topbar .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.topbar .sub::first-letter{text-transform:uppercase}
.tb-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:32px;width:240px;max-width:100%}
.btn{border:0;background:var(--primary);color:var(--primary-ink);font-weight:700;padding:9px 16px;border-radius:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--primary);color:var(--primary)}
.btn.sm{padding:6px 12px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--primary);font-weight:700}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.danger{color:var(--bad)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .logo{padding:0}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;scrollbar-width:none}
  .navi{width:auto;white-space:nowrap}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;padding:0}
  .side-foot .proto,.side-foot .note{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* summary cards */
.notice{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.84rem;color:var(--muted);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.notice b{color:var(--warn);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
button.kpi:hover{border-color:var(--primary)}
.kpi[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.kpi .k{font-size:.78rem;font-weight:700;color:var(--muted)}
.kpi .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:600;line-height:1.15}
.kpi .h{font-size:.76rem;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}
.kpi.warn .v{color:var(--warn)}
.kpi.good .v{color:var(--ok)}

/* record list */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.views{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.vtab{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:700;color:var(--muted);white-space:nowrap}
.vtab:hover{background:var(--sunk)}
.vtab[aria-selected="true"]{background:var(--primary-soft);color:var(--primary)}
.vtab .n{font-family:var(--font-mono);font-size:.74rem;margin-left:5px;opacity:.85}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:700;color:var(--muted)}
.day::first-letter{text-transform:uppercase}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tablewrap{overflow-x:auto}
table.list{width:100%;min-width:780px;border-collapse:collapse;font-size:.92rem}
.list th{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
.list th.num{text-align:right}
.list td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tbody tr:last-child td{border-bottom:0}
.list tbody tr.rec{cursor:pointer}
.list tbody tr.rec:hover td{background:var(--sunk)}
.list tbody tr.rec.cur td{background:var(--primary-soft)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.av.lg{width:46px;height:46px;font-size:1rem}
.who .nm{font-weight:700;color:var(--primary)}
.who .meta{font-size:.78rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.78rem;padding:2px 8px;border-radius:5px;background:var(--sunk);white-space:nowrap}
.tag.np{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--sunk);color:var(--muted)}
.plan{font-size:.84rem}
.plan.missing{color:var(--bad);font-weight:700}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.list tfoot td{font-weight:700;background:var(--sunk);border-top:1px solid var(--line)}

/* record panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(10,20,35,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}
.dh h2{font-size:1.2rem}
.dh .meta{color:var(--muted);font-size:.86rem;margin-top:2px}
.dh .meta::first-letter{text-transform:uppercase}
.xbtn{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px;font-size:1.3rem;line-height:1;flex:none}
.xbtn:hover{background:var(--sunk);color:var(--ink)}
.db{flex:1;overflow-y:auto;padding:4px 20px 20px}
.sec{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.84rem;font-weight:700}
.field select,.field input{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:.8rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tlist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tlist li .nm{flex:1;min-width:0;font-weight:700;font-size:.9rem}
.tlist li.np .nm{color:var(--muted);font-weight:400}
.tlist li .tooth{width:62px;padding:5px 7px;font-family:var(--font-mono);font-size:.84rem;text-align:center}
.tlist li .price{font-family:var(--font-mono);font-size:.84rem;color:var(--muted);min-width:64px;text-align:right}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:26px;line-height:1;padding:0}
.qty b{font-family:var(--font-mono);min-width:16px;text-align:center}
.rm{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:6px;font-size:1.05rem;line-height:1;flex:none}
.rm:hover{background:var(--bad-soft);color:var(--bad)}
select.add{border:1px dashed var(--primary);color:var(--primary);font-weight:700;background:var(--surface)}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.total .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.9rem;font-weight:600}
.bd{list-style:none;margin:0;padding:10px 12px;background:var(--sunk);border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.bd li{display:flex;justify-content:space-between;gap:10px}
.bd li span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.combo{font-size:.82rem;color:var(--ok);font-weight:700}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alist li{font-size:.86rem;padding:8px 10px;border-radius:8px;border-left:3px solid var(--bad);background:var(--bad-soft)}
.alist li.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.df{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vlist button{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.vlist button:hover{border-color:var(--primary)}
.vlist .d::first-letter{text-transform:uppercase}

/* payroll + fees */
table.plain{width:100%;border-collapse:collapse;font-size:.9rem}
.plain th{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
.plain th.num{text-align:right}
.plain td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.plain tfoot td{font-weight:700;background:var(--sunk);border-bottom:0}
.plain .detail>td{background:var(--sunk)}
.inner{width:100%;border-collapse:collapse;font-size:.86rem}
.inner td{padding:6px 8px;border-bottom:1px solid var(--line)}
.alerts{list-style:none;margin:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--bad)}
.alerts li.warn{border-left-color:var(--warn)}
.alerts .what{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.okline{color:var(--ok);font-weight:700;padding:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:18px;align-items:start}
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr)}}
.fees input{width:84px;text-align:right;font-family:var(--font-mono);padding:5px 7px}
.fees td{padding:5px 10px}
.fees .grp td{background:var(--sunk);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 16px}
.rules{list-style:none;margin:0;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;flex-direction:column;gap:5px;font-size:.88rem;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.rtag{align-self:flex-start;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.rtag.ded{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <aside class="side">
    <div class="logo brand">

function avatar(name,lg){let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;const k=1+h%6;return `<span class="av ${lg?'lg':''}" style="background:var(--av${k});color:var(--av${k}i)" aria-hidden="true">${esc(initials(name).toUpperCase())}</span>`;}

function evalItems(items,plan,v){
 const r=PD.priceVisit(items,plan,opts());
 if(v&&!v.dupOk&&items.some(i=>DUP_KEYS.has(i.k))&&S.visits.some(o=>o!==v&&o.patient===v.patient&&(o.date<v.date||(o.date===v.date&&idNum(o.id)<idNum(v.id)))&&o.items.some(i=>DUP_KEYS.has(i.k)&&items.some(j=>j.k===i.k))))r.alerts.push('dup');
 r.blocking=r.alerts.filter(a=>BLOCKING.has(a)).length;
 r.missing=r.parts.filter(x=>x.amount==null&&!(PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable')).map(partLabel);
 r.notIn=r.parts.filter(x=>PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable').map(partLabel);
 r.status=!items.length?'empty':r.alerts.includes('noIns')?'noIns':r.blocking?'review':r.alerts.length?'warn':'ok';
 return r;
}
function evalVisit(v){const p=pat(v.patient);return evalItems(v.items,p?p.plan:null,v);}

/* ---------- payroll ---------- */
function dentistRows(){
 const wk=weekVisits();
 return S.dentists.map(d=>{
  const vs=wk.filter(v=>v.dentist===d.id).sort((a,b)=>a.date.localeCompare(b.date)||idNum(a.id)-idNum(b.id));
  const ev=vs.map(v=>[v,evalVisit(v)]);
  const pay=Math.round(sum(ev.map(([,e])=>e.total||0))*100)/100;
  const block=sum(ev.map(([,e])=>e.blocking)),warn=ev.filter(([,e])=>e.alerts.some(a=>!BLOCKING.has(a))).length;
  const appr=S.approved[d.id]!=null&&Math.abs(S.approved[d.id]-pay)<0.005&&!block;
  return {d,vs,ev,pay,block,warn,appr,n:sum(vs.map(v=>v.items.length))};
 });
}

function refreshDrawer(focusId){save();renderShell();({today:renderToday,patients:renderPatients,payroll:renderPayroll,fees:renderFees})[S.page]();renderDrawer();const el=focusId&&document.getElementById(focusId);if(el)el.focus();}
function visit(id){return S.visits.find(v=>v.id===id);}
function addItemTo(items,id){
 let m;
 if((m=id.match(/^btw(\d)$/)))items.push({k:'btw',n:+m[1]});
 else if(id==='pa'){const pa=items.find(i=>i.k==='pa');if(pa)pa.n=(pa.n||1)+1;else items.push({k:'pa',n:1});}

}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='lang'){S.lang=b.dataset.lang;save();render();}
 else if(a==='page'){D=null;setPage(b.dataset.page);}
 else if(a==='reset'){const lang=S.lang;S=seed();S.lang=lang;D=null;save();render();toast(t('resetDone'));}
 else if(a==='view'){S.view=b.dataset.view;save();renderToday();}
 else if(a==='pview'){S.pview=b.dataset.view;save();renderPatients();}
 else if(a==='day'){S.date=b.dataset.d;save();renderToday();}
 else if(a==='new'){openDrawer({type:'new',draft:{name:'',dentist:S.dentist!=='all'?S.dentist:S.dentists[0].id,date:S.date,plan:null,planTouched:false,items:[]}},'d-name');}
 else if(a==='open-visit'){openDrawer({type:'visit',id:b.dataset.v},'d-add');}
 else if(a==='open-patient'){openDrawer({type:'patient',id:b.dataset.p},'d-plan');}
 else if(a==='close'){D=null;render();}
 else if(a==='rm'){const items=curItems();if(items){items.splice(+b.dataset.i,1);refreshDrawer('d-add');}}
 else if(a==='pa'){const items=curItems();if(items){const it=items[+b.dataset.i];it.n=Math.max(1,Math.min(18,(it.n||1)+(+b.dataset.d)));refreshDrawer(null);}}
 else if(a==='save-new'){
  const dr=D.draft;const name=dr.name.trim();
  if(!name){toast(t('d_needName'));$('#d-name')?.focus();return;}
  if(!dr.items.length){toast(t('d_needTreat'));$('#d-add')?.focus();return;}
  let p=findPatient(name);if(!p){p={id:'p'+(S.nextPat++),name,plan:null};S.patients.push(p);}
  if(dr.planTouched||!p.plan)p.plan=dr.plan||p.plan||null;
  const v={id:'v'+(S.nextVisit++),date:dr.date,dentist:dr.dentist,patient:p.id,items:dr.items};
  S.visits.push(v);S.date=dr.date;S.view='all';D={type:'visit',id:v.id};save();render();toast(t('created',p.name));
 }
 else if(a==='del-visit'){S.visits=S.visits.filter(v=>v.id!==D.id);D=null;save();render();toast(t('deleted'));}
 else if(a==='dup-ok'){const v=visit(b.dataset.v);if(v)v.dupOk=true;save();render();}
 else if(a==='dup-ok-cur'){const v=D&&visit(D.id);if(v)v.dupOk=true;refreshDrawer(null);}
 else if(a==='toggle'){S.open[b.dataset.d]=!S.open[b.dataset.d];save();renderPayroll();}
 else if(a==='approve'){const r=dentistRows().find(x=>x.d.id===b.dataset.d);if(r&&!r.block){S.approved[r.d.id]=r.pay;save();render();}}
 else if(a==='unapprove'){delete S.approved[b.dataset.d];save();render();}
 else if(a==='implant'){S.implantIdx=+b.dataset.i;save();render();toast(t('saved'));}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&D){D=null;render();return;}
 const tr=ev.target.closest&&ev.target.closest('tr.rec');
 if(tr&&(ev.key==='Enter'||ev.key===' ')&&ev.target===tr){ev.preventDefault();tr.click();}
 if(ev.key==='Enter'&&ev.target.dataset&&(ev.target.dataset.f==='tooth'||ev.target.dataset.f==='d-name')){ev.preventDefault();ev.target.blur();}
});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(el.id==='q'){S.q=el.value;const pos=el.selectionStart;(S.page==='patients'?renderPatients:renderToday)();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',ev=>{
 const el=ev.target,f=el.dataset.f;
 if(f==='dentist'){S.dentist=el.value;save();renderToday();}
 else if(f==='add'){const items=curItems();if(items&&el.value){const id=el.value;addItemTo(items,id);refreshDrawer(TOOTH.has(id)?`tooth-${items.length-1}`:'d-add');}}
 else if(f==='tooth'){const items=curItems();if(!items)return;const it=items[+el.dataset.i];const tv=validTooth(el.value);if(tv===null){toast(t('badTooth'));el.value=it.tooth||'';return;}if(tv)it.tooth=tv;else delete it.tooth;refreshDrawer('d-add');}
 else if(f==='d-name'){D.draft.name=el.value;refreshDrawer('d-plan');}
 else if(f==='d-dentist'){D.draft.dentist=el.value;}
 else if(f==='d-day'){D.draft.date=el.value;refreshDrawer(null);}
 else if(f==='d-plan'){D.draft.plan=el.value||null;D.draft.planTouched=true;refreshDrawer('d-add');}
 else if(f==='v-plan'){const v=visit(D.id);const p=pat(v.patient);p.plan=el.value||null;refreshDrawer('d-add');toast(t('saved'));}
 else if(f==='p-plan'){const p=pat(D.id);p.plan=el.value||null;refreshDrawer('d-plan');toast(t('saved'));}
 else if(f==='fee'){const v=el.value.trim();S.fees[el.dataset.id][el.dataset.col]=v===''?null:Math.max(0,+v);save();renderShell();toast(t('saved'));}
});

const h=(location.hash||'').slice(1);
if(PAGES.includes(h))S.page=h;
render();
})();
</script>

</body>
</html>
