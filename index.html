<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Producción Dental Delaware</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a spreadsheet. Column letters, row numbers, an fx bar that explains the selected row, and day tabs at the bottom like Excel sheets. One row per patient. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#eef1f6; --ink:#141d29; --muted:#5a6779; --line:#dce1ea; --grid:#d6dce6;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --ok:#16784b; --ok-soft:#e1f3e9; --warn:#985800; --warn-soft:#fbefda; --bad:#bd3027; --bad-soft:#fbe4e1;
  --font-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343; --grid:#2b3747;
  --accent:#7d9eff; --accent-ink:#0a1020; --accent-soft:#1a2646;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343; --grid:#2b3747;
  --accent:#7d9eff; --accent-ink:#0a1020; --accent-soft:#1a2646;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.8rem}
h1,h2{text-wrap:balance;margin:0}
h2{font-size:1.15rem}
p{margin:0}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;flex:none;color:var(--accent)}
.brand-name{font-weight:700;font-size:1.1rem}
.brand-sub{font-size:.8rem;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-family:var(--font-mono);font-size:.72rem;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--bad-soft);color:var(--bad);text-align:center}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:12px;font-size:.88rem;color:var(--muted)}
.chip-proto{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:4px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
main{padding-block:4px 48px}
.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:14px}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}

/* sheet */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.toolbar label{display:flex;align-items:center;gap:8px;font-weight:700}
.toolbar select{min-width:200px}
.summary{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.summary b{color:var(--ink)}
.help{color:var(--muted);font-size:.9rem;max-width:80ch}
.book{background:var(--surface);border:1px solid var(--grid);border-radius:8px;overflow:hidden;min-width:0}
.fx{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--grid);font-size:.86rem;min-height:38px}
.fx .fxl{font-family:var(--font-mono);font-style:italic;font-weight:600;color:var(--muted);flex:none;padding-right:10px;border-right:1px solid var(--grid)}
.fx .fxt{font-family:var(--font-mono);font-size:.8rem;min-width:0;overflow-wrap:anywhere}
.gridwrap{overflow-x:auto}
table.sheet{width:100%;min-width:820px;border-collapse:collapse;font-size:.9rem;table-layout:fixed}
.sheet th,.sheet td{border:1px solid var(--grid);padding:0;vertical-align:middle}
.sheet tr>*:first-child{border-left:0}
.sheet tr>*:last-child{border-right:0}
.sheet thead th{background:var(--sunk);font-weight:700;font-size:.78rem;color:var(--muted);padding:5px 10px;text-align:left;white-space:nowrap}
.sheet thead tr.letters th{font-family:var(--font-mono);font-weight:500;text-align:center;padding:2px;font-size:.72rem;border-top:0}
.sheet .rn{background:var(--sunk);color:var(--muted);font-family:var(--font-mono);font-size:.74rem;text-align:center;width:44px}
.sheet td:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.sheet tr.sel .rn{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cell{display:block;width:100%;border:0;background:transparent;padding:9px 10px;min-height:40px;border-radius:0}
.cell:focus{outline:none}
select.cell{appearance:auto}
.treat{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:5px 6px;min-height:40px}
.tchip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:6px;padding:2px 3px 2px 8px;font-size:.82rem;white-space:nowrap}
.tchip.np{color:var(--muted)}
.tchip .tooth{width:44px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:1px 4px;font-family:var(--font-mono);font-size:.78rem;text-align:center}
.tchip .tooth:placeholder-shown{border-style:dashed}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:20px;height:20px;line-height:1;padding:0;font-size:.8rem}
.qty b{font-family:var(--font-mono);min-width:14px;text-align:center}
.cx{border:0;background:none;color:var(--muted);padding:0 4px;font-size:1rem;line-height:1;border-radius:4px}
.cx:hover{color:var(--bad);background:var(--bad-soft)}
select.add{border:1px dashed var(--line);background:transparent;color:var(--accent);font-weight:700;font-size:.82rem;padding:3px 6px;border-radius:6px;max-width:190px}
.amt{padding:9px 10px;text-align:right}
.amt .none{color:var(--muted);font-family:var(--font-ui);font-size:.8rem}
.dot{display:block;width:10px;height:10px;border-radius:50%;margin:auto}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.dot.empty{background:var(--line)}
.del{border:0;background:none;color:var(--muted);width:100%;min-height:40px;font-size:1.05rem}
.del:hover{color:var(--bad);background:var(--bad-soft)}
tr.newrow .cell::placeholder{color:var(--accent);opacity:.85}
.sheet tfoot td{background:var(--sunk);font-weight:700;padding:9px 10px}
.sheettabs{display:flex;gap:2px;overflow-x:auto;background:var(--sunk);border-top:1px solid var(--grid);padding:0 6px;scrollbar-width:thin}
.stab{border:0;background:none;padding:8px 14px;font-size:.84rem;color:var(--muted);white-space:nowrap;border-top:3px solid transparent}
.stab::first-letter{text-transform:uppercase}
.stab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;border-top-color:var(--accent)}
.stab .n{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-left:4px}

/* payroll + fees */
.tablewrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.plain{width:100%;border-collapse:collapse;font-size:.9rem}
.plain th{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.plain th.num{text-align:right}
.plain td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.plain tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.plain .detail>td{background:var(--sunk)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 14px;border-radius:8px}
.ghost{border:1px solid var(--line);background:var(--surface);font-weight:700;padding:6px 12px;border-radius:7px;font-size:.86rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--bad)}
.alerts li.warn{border-left-color:var(--warn)}
.alerts .what{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.alerts .acts{display:flex;gap:6px;flex-wrap:wrap}
.okline{color:var(--ok);font-weight:700}
.fees input{width:84px;text-align:right;font-family:var(--font-mono);padding:5px 7px}
.fees td{vertical-align:middle;padding:5px 8px}
.fees .grp td{background:var(--sunk);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
@media (max-width:1060px){.split{grid-template-columns:minmax(0,1fr)}}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;flex-direction:column;gap:4px;font-size:.88rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.tag{align-self:flex-start;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ded{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M10.5 4C6.9 4 5 6.9 5 10.2c0 2.8 1.1 4.7 1.9 7.2.8 2.6 1.1 5.8 2.2 8.9.6 1.6 2.4 1.6 2.9.1.8-2.4 1.3-6.1 4-6.1s3.2 3.7 4 6.1c.5 1.5 2.3 1.5 2.9-.1 1.1-3.1 1.4-6.3 2.2-8.9.8-2.5 1.9-4.4 1.9-7.2C27 6.9 25.1 4 21.5 4c-2.1 0-3.2 1-5.5 1S12.6 4 10.5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="min-width:0">

    <div class="lang" role="group" aria-label="Idioma / Language">

      <button type="button" id="lang-en" data-action="lang" data-lang="en">EN</button>
    </div>
  </div>
  <nav class="wrap tabs" role="tablist" id="tabs"></nav>
</header>

<div class="wrap notice">
  <span class="chip-proto" data-i18n="tagProto"></span>
  <span data-i18n="notice"></span>
  <button type="button" class="linkbtn" id="btn-reset" data-action="reset" data-i18n="reset"></button>
</div>

<main class="wrap">
  <section class="view" id="view-sheet" role="tabpanel"></section>

  <section class="view" id="view-fees" role="tabpanel" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

try{const raw=localStorage.getItem(LS_KEY);const p=raw&&JSON.parse(raw);if(p&&p.v===4&&Array.isArray(p.visits))S=p;}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k,...a){const v=T[S.lang][k];return typeof v==='function'?v(...a):(v??k);}
const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmtDate=(iso,o)=>new Date(iso+'T12:00:00').toLocaleDateString(t('locale'),o||{weekday:'long',day:'numeric',month:'long'});
const den=id=>S.dentists.find(d=>d.id===id);
const pat=id=>S.patients.find(p=>p.id===id);
const idNum=id=>+String(id).slice(1);
const colName=c=>c?PD.COL_NAMES[c]:'—';
const weekVisits=()=>S.visits.filter(v=>DAYS.includes(v.date));
const itemName=id=>PD.ITEM[id]?PD.ITEM[id][S.lang]:id;
const groupLabel=g=>{const x=PD.GROUPS.find(r=>r[0]===g);return x?(S.lang==='es'?x[1]:x[2]):g;};
function optLabel(id){return id==='pa'?t('paLabel'):itemName(id);}
function chipLabel(it){
 if(it.k==='btw')return `${it.n} BW`;
 if(it.k==='pa')return 'PA';
 return itemName(it.k);
}
function partLabel(p){return itemName(p.id)+(p.qty>1?' ×'+p.qty:'')+(p.tooth?' #'+p.tooth:'');}
function opts(){return {fees:S.fees,implantIdx:S.implantIdx};}
function validTooth(s){s=String(s||'').trim().toUpperCase().replace(/^#/,'');if(!s)return '';if(/^[A-T]$/.test(s))return s;if(/^\d{1,2}$/.test(s)&&+s>=1&&+s<=32)return String(+s);return null;}

function evalVisit(v){
 const p=pat(v.patient);
 const r=PD.priceVisit(v.items,p?p.plan:null,opts());
 if(!v.dupOk&&v.items.some(i=>DUP_KEYS.has(i.k))&&S.visits.some(o=>o!==v&&o.patient===v.patient&&(o.date<v.date||(o.date===v.date&&idNum(o.id)<idNum(v.id)))&&o.items.some(i=>DUP_KEYS.has(i.k)&&v.items.some(j=>j.k===i.k))))r.alerts.push('dup');
 r.blocking=r.alerts.filter(a=>BLOCKING.has(a)).length;
 r.missing=r.parts.filter(x=>x.amount==null&&!(PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable')).map(partLabel);
 r.notIn=r.parts.filter(x=>PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable').map(partLabel);
 return r;
}
function dotFor(v,e){
 if(!v.items.length)return ['empty',t('st_empty')];
 if(!e.alerts.length)return ['ok',t('st_ok')];
 return [e.blocking?'bad':'warn',e.alerts.map(a=>t('st_'+a)).join(' · ')];
}
function pillsFor(e){
 if(!e.alerts.length)return `<span class="pill ok">${t('st_ok')}</span>`;
 return `<span class="pills">${e.alerts.map(a=>`<span class="pill ${BLOCKING.has(a)?'bad':'warn'}">${t('st_'+a)}</span>`).join('')}</span>`;
}
function findPatient(name){const k=name.trim().toLowerCase();return S.patients.find(p=>p.name.toLowerCase()===k);}
function patientByName(name){let p=findPatient(name);if(!p){p={id:'p'+(S.nextPat++),name:name.trim(),plan:null};S.patients.push(p);}return p;}

let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

 $('#tabs').innerHTML=TABS.map(([k])=>`<button type="button" class="tab" role="tab" id="tab-${k}" data-action="tab" data-tab="${k}" aria-selected="${S.tab===k}" aria-controls="view-${k}">${t('tab_'+k)}${badge[k]?`<span class="badge">${badge[k]}</span>`:''}</button>`).join('');

}

}

 if(TOOTH.has(it.k))h+=`<input class="tooth" id="tooth-${v.id}-${i}" data-f="tooth" data-v="${v.id}" data-i="${i}" value="${esc(it.tooth||'')}" placeholder="${t('toothPh')}" maxlength="3" inputmode="text" aria-label="${esc(t('tooth')+' · '+chipLabel(it))}">`;
 if(it.k==='pa')h+=`<span class="qty"><button type="button" data-action="pa" data-d="-1" data-v="${v.id}" data-i="${i}" aria-label="${t('less')}">−</button><b>${it.n||1}</b><button type="button" data-action="pa" data-d="1" data-v="${v.id}" data-i="${i}" aria-label="${t('more')}">+</button></span>`;
 h+=`<button type="button" class="cx" data-action="rm" data-v="${v.id}" data-i="${i}" aria-label="${esc(t('remove')+' '+chipLabel(it))}">×</button></span>`;
 return h;
}

function renderFx(){
 const el=$('#fx');if(!el)return;
 const v=FOCUS&&S.visits.find(x=>x.id===FOCUS);
 document.querySelectorAll('tr[data-row]').forEach(tr=>tr.classList.toggle('sel',tr.dataset.row===FOCUS));
 if(!v||v.dentist!==S.dentist||v.date!==S.date){el.textContent=t('fxHint');return;}
 const e=evalVisit(v);
 if(!v.items.length){el.textContent=t('fxEmpty');return;}
 if(!e.col){el.textContent=t('fxNoPlan');return;}
 let s='= '+e.parts.map(p=>`${partLabel(p)} ${money(p.amount)}`).join(' + ')+` → ${money(e.total)}  (${colName(e.col)})`;
 const notes=e.alerts.filter(a=>a!=='noIns').map(a=>alertMsg(a,e));
 if(notes.length)s+='   · '+notes.join(' · ');
 el.textContent=s;
}
function alertMsg(a,e){return a==='noIns'?t('a_noIns'):a==='noPrice'?t('a_noPrice',e.missing.join(', '),colName(e.col)):a==='notInTable'?t('a_notInTable',e.notIn.join(', ')):a==='twoPrices'?t('a_twoPrices'):t('a_dup');}

function dentistRows(){
 const wk=weekVisits();
 return S.dentists.map(d=>{
  const vs=wk.filter(v=>v.dentist===d.id).sort((a,b)=>a.date.localeCompare(b.date)||idNum(a.id)-idNum(b.id));
  const ev=vs.map(v=>[v,evalVisit(v)]);
  const pay=Math.round(sum(ev.map(([,e])=>e.total||0))*100)/100;
  const block=sum(ev.map(([,e])=>e.blocking)),warn=ev.filter(([,e])=>e.alerts.some(a=>!BLOCKING.has(a))).length;
  const appr=S.approved[d.id]!=null&&Math.abs(S.approved[d.id]-pay)<0.005&&!block;
  return {d,vs,ev,pay,block,warn,appr,n:sum(vs.map(v=>v.items.length))};
 });
}

/* ---------- actions ---------- */
function visit(id){return S.visits.find(v=>v.id===id);}
function refocus(id){const el=id&&document.getElementById(id);if(el)el.focus();}
function changed(focusId){save();renderChrome();renderSheet();refocus(focusId);}
function setTab(k){S.tab=k;save();render();try{history.replaceState(null,'','#'+TABS.find(x=>x[0]===k)[1]);}catch(e){}window.scrollTo(0,0);}
function commitNewPatient(el){
 const name=el.value.trim();if(!name)return;
 const p=patientByName(name);
 const v={id:'v'+(S.nextVisit++),date:S.date,dentist:S.dentist,patient:p.id,items:[]};
 S.visits.push(v);FOCUS=v.id;
 changed('add-'+v.id);
}

 if(a==='lang'){S.lang=b.dataset.lang;save();render();}
 else if(a==='tab')setTab(b.dataset.tab);
 else if(a==='reset'){const lang=S.lang,tab=S.tab;S=seed();S.lang=lang;S.tab=tab;FOCUS=null;save();render();toast(t('resetDone'));}
 else if(a==='day'){S.date=b.dataset.d;FOCUS=null;save();renderSheet();}
 else if(a==='rm'){const v=visit(b.dataset.v);if(v){v.items.splice(+b.dataset.i,1);FOCUS=v.id;changed('add-'+v.id);}}
 else if(a==='pa'){const v=visit(b.dataset.v);if(v){const it=v.items[+b.dataset.i];it.n=Math.max(1,Math.min(18,(it.n||1)+(+b.dataset.d)));FOCUS=v.id;changed(null);}}
 else if(a==='del-row'){S.visits=S.visits.filter(v=>v.id!==b.dataset.v);if(FOCUS===b.dataset.v)FOCUS=null;changed(null);toast(t('rowRemoved'));}
 else if(a==='toggle'){S.open[b.dataset.d]=!S.open[b.dataset.d];save();renderPayroll();}
 else if(a==='approve'){const r=dentistRows().find(x=>x.d.id===b.dataset.d);if(r&&!r.block){S.approved[r.d.id]=r.pay;save();renderPayroll();}}
 else if(a==='unapprove'){delete S.approved[b.dataset.d];save();renderPayroll();}
 else if(a==='dup-ok'){const v=visit(b.dataset.v);if(v)v.dupOk=true;save();render();}
 else if(a==='goto-row'){const v=visit(b.dataset.v);if(v){S.dentist=v.dentist;S.date=v.date;FOCUS=v.id;setTab('sheet');refocus('plan-'+v.id);}}
 else if(a==='implant'){S.implantIdx=+b.dataset.i;save();renderFees();renderChrome();toast(t('saved'));}
});
document.addEventListener('focusin',ev=>{
 const tr=ev.target.closest&&ev.target.closest('tr[data-row]');
 const id=tr?tr.dataset.row:null;
 if(id&&id!==FOCUS){FOCUS=id;renderFx();}
});
document.addEventListener('change',ev=>{
 const el=ev.target,f=el.dataset.f;
 if(el.id==='new-patient'){commitNewPatient(el);return;}
 if(f==='dentist'){S.dentist=el.value;FOCUS=null;save();renderSheet();}
 else if(f==='add'){const v=visit(el.dataset.v),id=el.value;if(!v||!id)return;
  let m;
  if((m=id.match(/^btw(\d)$/)))v.items.push({k:'btw',n:+m[1]});
  else if(id==='pa'){const pa=v.items.find(i=>i.k==='pa');if(pa)pa.n=(pa.n||1)+1;else v.items.push({k:'pa',n:1});}
  else v.items.push({k:id});
  FOCUS=v.id;
  const idx=v.items.length-1;
  changed(TOOTH.has(id)?`tooth-${v.id}-${idx}`:'add-'+v.id);}
 else if(f==='tooth'){const v=visit(el.dataset.v);if(!v)return;const it=v.items[+el.dataset.i];const tv=validTooth(el.value);
  if(tv===null){toast(t('badTooth'));el.value=it.tooth||'';return;}
  if(tv)it.tooth=tv;else delete it.tooth;FOCUS=v.id;changed('add-'+v.id);}
 else if(f==='plan'){const v=visit(el.dataset.v);if(!v)return;const p=pat(v.patient);p.plan=el.value||null;FOCUS=v.id;changed('plan-'+v.id);}
 else if(f==='patient'){const v=visit(el.dataset.v);if(!v)return;const name=el.value.trim();if(!name){el.value=pat(v.patient).name;return;}v.patient=patientByName(name).id;FOCUS=v.id;changed('add-'+v.id);}
 else if(f==='fee'){const v=el.value.trim();S.fees[el.dataset.id][el.dataset.col]=v===''?null:Math.max(0,+v);save();renderChrome();toast(t('saved'));}
});
document.addEventListener('keydown',ev=>{
 const el=ev.target;
 if(ev.key==='Enter'&&(el.id==='new-patient'||el.dataset&&el.dataset.f==='patient'||el.dataset&&el.dataset.f==='tooth')){ev.preventDefault();el.blur();}
});

const fromHash=(location.hash||'').slice(1);
const hit=TABS.find(x=>x[1]===fromHash);
if(hit)S.tab=hit[0];
render();
})();
</script>

</body>
</html>
