<title>Producción Dental Delaware</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Header band with role tabs, one working pane per role. Signature detail: tooth chart in Universal numbering + the clinic's own fee table and combos. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#edf0f5; --ink:#141d29; --muted:#5a6779; --line:#dce1ea;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --ok:#16784b; --ok-soft:#e1f3e9; --warn:#985800; --warn-soft:#fbefda; --bad:#bd3027; --bad-soft:#fbe4e1;
  --font-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343;
  --accent:#7d9eff; --accent-ink:#0a1020; --accent-soft:#1a2646;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --sunk:#1b2431; --ink:#e7ecf3; --muted:#9ba7b7; --line:#283343;
  --accent:#7d9eff; --accent-ink:#0a1020; --accent-soft:#1a2646;
  --ok:#5ccb97; --ok-soft:#12291f; --warn:#f0b45c; --warn-soft:#2d2213; --bad:#ff7e72; --bad-soft:#351a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.8rem}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:1.15rem}
p{margin:0}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;flex:none;color:var(--accent)}
.brand-name{font-weight:700;font-size:1.1rem;letter-spacing:.01em}
.brand-sub{font-size:.8rem;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-family:var(--font-mono);font-size:.72rem;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--bad-soft);color:var(--bad);text-align:center}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:12px;font-size:.88rem;color:var(--muted)}
.chip-proto{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:4px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

main{padding-block:4px 48px}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:14px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;font-family:var(--font-mono);font-size:.82rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.toolbar .field{width:220px;max-width:100%}
.daylabel{font-weight:700;padding-bottom:9px}
.daylabel::first-letter{text-transform:uppercase}

.stats{display:flex;flex-wrap:wrap;gap:10px 32px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600}
.stat.hl b{color:var(--accent)}
.stat.good b{color:var(--ok)}
.stat.alert b{color:var(--warn)}

.grid2{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}

.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stack{display:flex;flex-direction:column;gap:14px}
.insinfo{font-size:.86rem;color:var(--muted);min-height:1.3em}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ex{border:1px dashed var(--line);background:none;border-radius:6px;padding:3px 8px;font-family:var(--font-mono);font-size:.78rem;color:var(--muted);text-align:left}
.ex:hover{border-color:var(--accent);color:var(--accent)}

.parsed{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.parsed li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:baseline;font-size:.88rem;padding:7px 10px;border-radius:7px;background:var(--sunk)}
.parsed li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);align-self:center;justify-self:center}
.parsed li.bad{background:var(--bad-soft);color:var(--bad)}
.parsed li.bad::before{background:var(--bad)}
.parsed li.warn{background:var(--warn-soft);color:var(--warn)}
.parsed li.warn::before{background:var(--warn)}
.parsed li.skip{background:none;border:1px dashed var(--line);color:var(--muted)}
.parsed li.skip::before{background:var(--line)}
.raw{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:8px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--surface);font-weight:700;padding:6px 12px;border-radius:7px;font-size:.86rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:.84rem;color:var(--warn)}

.chart{display:flex;flex-direction:column;gap:4px;padding:10px;background:var(--sunk);border-radius:8px}
.chart-cap{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.arch{display:flex;gap:8px}
.arch+.arch{border-top:1px solid var(--line);padding-top:4px}
.half{flex:1;display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:3px;min-width:0}
.tooth{border:1px solid var(--line);background:var(--surface);border-radius:5px 5px 8px 8px;height:32px;padding:0;font-family:var(--font-mono);font-size:.74rem;font-weight:600;min-width:0}
.arch.lower .tooth{border-radius:8px 8px 5px 5px}
.tooth.ant{background:color-mix(in srgb,var(--surface) 70%,var(--sunk))}
.tooth.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:38px;height:34px;font-family:var(--font-mono);font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:flex;flex-wrap:wrap;gap:12px}
.row2 .field{width:140px}

.tablewrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.items{display:flex;flex-wrap:wrap;gap:4px;min-width:200px}
.it{font-size:.8rem;padding:2px 7px;border-radius:5px;background:var(--sunk);white-space:nowrap}
.it.np{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.bd{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:.74rem;color:var(--muted);text-align:right}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted);font-size:.75em}

.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ins{background:var(--sunk);color:var(--ink);font-weight:400}
.pills{display:flex;flex-wrap:wrap;gap:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pcard .name{font-weight:700}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-size:.9rem}
.callout .pill{background:var(--accent);color:var(--accent-ink)}

.dname{font-weight:700}
.detail>td{background:var(--sunk)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--bad)}
.alerts li.warn{border-left-color:var(--warn)}
.alerts .what{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.alerts .acts{display:flex;gap:6px;flex-wrap:wrap}
.okline{color:var(--ok);font-weight:700}

.fees input{width:84px;text-align:right;font-family:var(--font-mono);padding:5px 7px}
.fees td{vertical-align:middle;padding:5px 8px}
.fees .grp td{background:var(--sunk);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
@media (max-width:1060px){.split{grid-template-columns:minmax(0,1fr)}}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;flex-direction:column;gap:4px;font-size:.88rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.tag{align-self:flex-start;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.ded{background:var(--warn-soft);color:var(--warn)}
tr.diff td{background:var(--warn-soft)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M10.5 4C6.9 4 5 6.9 5 10.2c0 2.8 1.1 4.7 1.9 7.2.8 2.6 1.1 5.8 2.2 8.9.6 1.6 2.4 1.6 2.9.1.8-2.4 1.3-6.1 4-6.1s3.2 3.7 4 6.1c.5 1.5 2.3 1.5 2.9-.1 1.1-3.1 1.4-6.3 2.2-8.9.8-2.5 1.9-4.4 1.9-7.2C27 6.9 25.1 4 21.5 4c-2.1 0-3.2 1-5.5 1S12.6 4 10.5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>

    <div class="lang" role="group" aria-label="Idioma / Language">

  <nav class="wrap tabs" role="tablist" id="tabs"></nav>
</header>

<div class="wrap notice">
  <span class="chip-proto" data-i18n="tagProto"></span>
  <span data-i18n="notice"></span>

</div>

<main class="wrap">
  <section class="view" id="view-dentist" role="tabpanel"></section>
  <section class="view" id="view-desk" role="tabpanel" hidden></section>

</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function itemLabel(it){
 if(it.k==='fill')return `${t('composite')} #${it.tooth} ${it.surf}`;
 if(it.k==='btw')return `${it.n} BW`;
 if(it.k==='pa')return `${it.n} PA`;
 return itemName(it.k)+(it.tooth?' #'+it.tooth:'');
}
function partLabel(p){return itemName(p.id)+(p.qty>1?' ×'+p.qty:'')+(p.tooth?' #'+p.tooth+(p.surf?' '+p.surf:''):'');}
function opts(){return {fees:S.fees,implantIdx:S.implantIdx};}

function evalVisit(v){
 const p=pat(v.patient);
 const r=PD.priceVisit(v.items,p?p.plan:null,opts());
 if(!v.dupOk&&v.items.some(i=>DUP_KEYS.has(i.k))&&S.visits.some(o=>o!==v&&o.patient===v.patient&&(o.date<v.date||(o.date===v.date&&idNum(o.id)<idNum(v.id)))&&o.items.some(i=>DUP_KEYS.has(i.k)&&v.items.some(j=>j.k===i.k))))r.alerts.push('dup');
 r.blocking=r.alerts.filter(a=>BLOCKING.has(a)).length;
 r.missing=r.parts.filter(x=>x.amount==null&&!(PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable')).map(partLabel);
 r.notIn=r.parts.filter(x=>PD.ITEM[x.id]&&PD.ITEM[x.id].g==='notable').map(partLabel);
 return r;
}
function pillClass(a){return BLOCKING.has(a)?'bad':'warn';}
function statusPills(e){
 if(!e.alerts.length)return `<span class="pill ok">${t('st_ok')}</span>`;
 return `<span class="pills">${e.alerts.map(a=>`<span class="pill ${pillClass(a)}">${t('st_'+a)}</span>`).join('')}</span>`;
}
function itemsHtml(items){return `<div class="items">${items.map(i=>`<span class="it ${PD.ITEM[i.k]&&PD.ITEM[i.k].g==='nopay'?'np':''}">${esc(itemLabel(i))}</span>`).join('')}</div>`;}
function breakdownHtml(e){
 if(!e.col)return '';
 return `<div class="bd">${e.parts.map(p=>`<span>${esc(partLabel(p))}: ${money(p.amount)}</span>`).join('')}</div>`;
}

function findPatient(name){const k=name.trim().toLowerCase();return S.patients.find(p=>p.name.toLowerCase()===k);}

let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

function pickerItems(){
 const id=F.pick;if(!id)return {items:[],err:null};

 if(TOOTH_KEYS.has(id)&&!teeth.length)return {items:[],err:t('pickTooth')};
 if(id==='fill'){const sf=SURF.filter(x=>F.surf.has(x)).join('');if(!sf)return {items:[],err:t('pickSurf')};return {items:teeth.map(x=>({k:'fill',tooth:x,surf:sf}))};}
 if(id==='endo')return {items:teeth.map(x=>({k:PD.endoId(x),tooth:x}))};
 if(id==='btw')return {items:[{k:'btw',n:F.films}]};

 if(TOOTH_KEYS.has(id))return {items:teeth.map(x=>({k:id==='extsimple'&&PD.isPrimary(x)?'extbaby':id,tooth:x}))};

function toothChart(){
 const prim=F.dent==='prim';
 const btn=n=>`<button type="button" class="tooth ${PD.isAnterior(n)?'ant':''} ${F.teeth.has(n)?'on':''}" data-action="tooth" data-t="${n}" aria-pressed="${F.teeth.has(n)}">${n}</button>`;
 const upper=prim?'ABCDEFGHIJ'.split(''):Array.from({length:16},(_,i)=>String(i+1));
 const lower=prim?'TSRQPONMLK'.split(''):Array.from({length:16},(_,i)=>String(32-i));
 const h=upper.length/2;
 const arch=(a,cls)=>`<div class="arch ${cls}"><div class="half" style="--n:${h}">${a.slice(0,h).map(btn).join('')}</div><div class="half" style="--n:${h}">${a.slice(h).map(btn).join('')}</div></div>`;
 return `<div class="chart"><div class="chart-cap"><span>${t('patientRight')}</span><span>${t('upper')}</span><span>${t('patientLeft')}</span></div>${arch(upper,'upper')}${arch(lower,'lower')}<div class="chart-cap"><span></span><span>${t('lower')}</span><span></span></div></div>`;
}

function dentistRows(){
 const wk=weekVisits();
 return S.dentists.map(d=>{
  const vs=wk.filter(v=>v.dentist===d.id).sort((a,b)=>a.date.localeCompare(b.date)||idNum(a.id)-idNum(b.id));
  const ev=vs.map(v=>[v,evalVisit(v)]);
  const pay=Math.round(sum(ev.map(([,e])=>e.total||0))*100)/100;
  const block=sum(ev.map(([,e])=>e.blocking)),warn=ev.filter(([,e])=>e.alerts.some(a=>!BLOCKING.has(a))).length;
  const appr=S.approved[d.id]!=null&&Math.abs(S.approved[d.id]-pay)<0.005&&!block;
  return {d,vs,ev,pay,block,warn,appr,n:sum(vs.map(v=>v.items.length))};
 });
}
function renderPayroll(){
 const rows=dentistRows();
 const alerts=[];
 rows.forEach(r=>r.ev.forEach(([v,e])=>e.alerts.forEach(a=>alerts.push({v,e,a,d:r.d}))));

 $('#view-payroll').innerHTML=`
 <section class="card">
  <div class="card-head"><h2>${t('payTitle')}</h2><span class="muted">${t('payPeriod')}</span></div>
  <div class="tablewrap"><table><thead><tr><th>${t('colDentist')}</th><th class="num">${t('colPatients')}</th><th class="num">${t('colN')}</th><th class="num">${t('colPay')}</th><th>${t('colAlerts')}</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr>
   <td><div class="dname">${esc(r.d.name)}</div><button type="button" class="linkbtn small" data-action="toggle" data-d="${r.d.id}">${S.open[r.d.id]?t('hide'):t('details')}</button></td>
   <td class="num">${r.vs.length}</td><td class="num">${r.n}</td><td class="num"><b>${money(r.pay)}</b></td>
   <td><span class="pills">${r.block?`<span class="pill bad">${r.block}</span>`:''}${r.warn?`<span class="pill warn">${r.warn}</span>`:''}${!r.block&&!r.warn?`<span class="pill ok">0</span>`:''}</span></td>
   <td style="white-space:nowrap">${r.appr?`<span class="pill ok">${t('approved')}</span> <button type="button" class="linkbtn small" data-action="unapprove" data-d="${r.d.id}">${t('undo')}</button>`:r.block?`<span class="muted small">${t('resolveFirst',r.block)}</span>`:`<button type="button" class="primary" style="padding:6px 14px" data-action="approve" data-d="${r.d.id}">${t('approve')}</button>`}</td>
  </tr>${S.open[r.d.id]?`<tr class="detail"><td colspan="6"><div class="tablewrap"><table><tbody>${r.ev.map(([v,e])=>`<tr><td class="mono" style="white-space:nowrap">${esc(shortDate(v.date))}</td><td>${esc(pat(v.patient).name)}</td><td>${itemsHtml(v.items)}</td><td>${esc(colName(e.col))}</td><td class="num">${money(e.total)}</td><td>${statusPills(e)}</td></tr>`).join('')}</tbody></table></div></td></tr>`:''}`).join('')}
  </tbody><tfoot><tr><td>${t('total')}</td><td class="num">${sum(rows.map(r=>r.vs.length))}</td><td class="num">${sum(rows.map(r=>r.n))}</td><td class="num">${money(sum(rows.map(r=>r.pay)))}</td><td colspan="2"></td></tr></tfoot></table></div>
 </section>
 <section class="card">
  <div class="card-head"><h2>${t('alertsTitle')}</h2>${alerts.length?`<span class="muted">${alerts.length}</span>`:''}</div>
  ${alerts.length?`<ul class="alerts">${alerts.map(x=>`<li class="${BLOCKING.has(x.a)?'':'warn'}"><div class="what"><span><span class="pill ${pillClass(x.a)}">${t('st_'+x.a)}</span> <b>${esc(pat(x.v.patient).name)}</b> · ${esc(x.v.items.map(itemLabel).join(', '))}</span><span class="muted small">${esc(msg(x))} ${esc(x.d.name)} · ${esc(shortDate(x.v.date))}</span></div><div class="acts">${acts(x)}</div></li>`).join('')}</ul>`:`<p class="okline">${t('alertsNone')}</p>`}
 </section>`;
}

// Rows pasted from the clinic's Excel: A patient (ignored), B procedures, C MC, D insurance, E amount
function parsePaste(text){
 return text.split(/\r?\n/).map(line=>line.split('\t')).map(c=>{
  if(c.length>=5)c=c.slice(1);
  if(c.length<4)return null;
  const [txt,mc,ins,amt]=c.map(x=>(x||'').trim());
  const amount=parseFloat(String(amt).replace(/[$,\s]/g,''));
  if(!txt||/^total$/i.test(ins)||isNaN(amount))return null;
  return {text:txt,mc,ins,amount};
 }).filter(Boolean);
}
function checkRow(r){
 const plan=PD.planFromSheet(r.mc,r.ins);
 const items=PD.usable(PD.parseText(r.text));
 const res=PD.priceVisit(items,plan,opts());
 const same=res.total!=null&&Math.abs(res.total-r.amount)<0.005;
 let hint='';
 if(!same){
  if(res.alerts.includes('notInTable'))hint=t('hintNotInTable',money(r.amount));
  else{
   for(let i=0;i<items.length&&!hint;i++){const sub=items.filter((_,j)=>j!==i);const x=PD.priceVisit(sub,plan,opts());if(x.total!=null&&Math.abs(x.total-r.amount)<0.005)hint=t('hintDrop',itemLabel(items[i]));}
   if(!hint)hint=t('hintNone');
  }
 }
 return {r,plan,items,res,same,hint};
}
function renderCheck(){
 $('#view-check').innerHTML=`
 <section class="card">
  <div class="card-head"><h2>${t('checkTitle')}</h2></div>
  <div class="stack">
   <p class="muted" style="max-width:76ch">${t('checkIntro')}</p>
   <textarea id="in-paste" rows="6" spellcheck="false" placeholder="${esc(t('pastePh'))}">${esc(PASTE)}</textarea>
   <div class="row2"><button type="button" class="ghost" data-action="sample">${t('loadSample')}</button><button type="button" class="ghost" data-action="clear-paste">${t('clear')}</button></div>
  </div>
 </section>
 <div id="check-out" class="view"></div>`;
 renderCheckOut();
}
function renderCheckOut(){
 const el=$('#check-out');if(!el)return;
 const rows=parsePaste(PASTE).map(checkRow);
 if(!rows.length){el.innerHTML=`<p class="muted">${t('noRows')}</p>`;return;}
 const diffs=rows.filter(x=>!x.same);
 const insTxt=x=>[x.r.mc,x.r.ins].filter(Boolean).join(' · ');
 const calcCell=x=>`<details><summary>${money(x.res.total)}</summary>${breakdownHtml(x.res)}</details>`;
 el.innerHTML=`
 <div class="stats">
  <div class="stat"><span class="lbl">${t('cRows')}</span><b>${rows.length}</b></div>
  <div class="stat good"><span class="lbl">${t('cMatch')}</span><b>${rows.length-diffs.length}</b></div>
  <div class="stat alert"><span class="lbl">${t('cDiff')}</span><b>${diffs.length}</b></div>
  <div class="stat"><span class="lbl">${t('cSheet')}</span><b>${money(sum(rows.map(x=>x.r.amount)))}</b></div>
  <div class="stat hl"><span class="lbl">${t('cCalc')}</span><b>${money(sum(rows.map(x=>x.res.total||0)))}</b></div>
 </div>
 ${diffs.length?`<section class="card"><div class="card-head"><h2>${t('diffsTitle')}</h2></div><ul class="alerts">${diffs.map(x=>`<li class="warn"><div class="what"><span class="mono small">${esc(x.r.text)}</span><span class="muted small">${esc(insTxt(x))} → ${esc(colName(x.res.col))} · ${t('colSheet')} <b>${money(x.r.amount)}</b> · ${t('colCalc')} <b>${money(x.res.total)}</b></span><span class="small">${esc(x.hint)}</span></div><div>${breakdownHtml(x.res)}</div></li>`).join('')}</ul></section>`:''}
 <section class="card"><div class="card-head"><h2>${t('allRows')}</h2></div>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>${t('colText')}</th><th>${t('colIns')}</th><th>${t('colPlan')}</th><th class="num">${t('colSheet')}</th><th class="num">${t('colCalc')}</th><th></th></tr></thead><tbody>
  ${rows.map((x,i)=>`<tr class="${x.same?'':'diff'}"><td class="mono muted">${i+1}</td><td class="mono small" style="min-width:220px">${esc(x.r.text)}</td><td class="small">${esc(insTxt(x))}</td><td class="small">${esc(colName(x.res.col))}</td><td class="num">${money(x.r.amount)}</td><td class="num">${calcCell(x)}</td><td>${x.same?`<span class="pill ok">${t('same')}</span>`:`<span class="pill warn">${t('differs')}</span>`}</td></tr>`).join('')}
  </tbody></table></div>
 </section>`;
}

/* ---------- actions ---------- */
function addItems(items,raw){
 const name=F.patient.trim();
 if(!name){toast(t('needPatient'));$('#in-patient').focus();return false;}
 let p=findPatient(name);
 if(!p){p={id:'p'+(S.nextPat++),name,plan:null};S.patients.push(p);}
 let v=S.visits.find(x=>x.patient===p.id&&x.date===S.date&&x.dentist===S.dentist);
 if(!v){v={id:'v'+(S.nextVisit++),date:S.date,dentist:S.dentist,patient:p.id,items:[],raw:[]};S.visits.push(v);}
 items.forEach(i=>v.items.push(clean(i)));
 if(raw)v.raw.push(raw);
 save();
 toast(t('added',items.length,p.name));
 return true;
}
function resetForm(){F.patient='';F.quick='';F.pick='';F.teeth=new Set();F.surf=new Set();F.films=4;F.pa=1;}
function setTab(k){S.tab=k;save();render();try{history.replaceState(null,'','#'+TABS.find(x=>x[0]===k)[1]);}catch(e){}window.scrollTo(0,0);}

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='lang'){S.lang=b.dataset.lang;save();render();}
 else if(a==='tab'||a==='goto')setTab(b.dataset.tab);
 else if(a==='reset'){const lang=S.lang,tab=S.tab;S=seed();S.lang=lang;S.tab=tab;resetForm();save();render();toast(t('resetDone'));}
 else if(a==='mode'){S.mode=b.dataset.mode;save();renderDentist();}
 else if(a==='example'){F.quick=b.dataset.text;$('#in-quick').value=F.quick;renderQuickPreview();}
 else if(a==='add-quick'){const items=PD.usable(quickItems());if(items.length&&addItems(items,F.quick.trim())){resetForm();render();}}
 else if(a==='add-pick'){const {items}=pickerItems();if(items.length&&addItems(items,null)){resetForm();render();}}
 else if(a==='tooth'){const n=b.dataset.t;F.teeth.has(n)?F.teeth.delete(n):F.teeth.add(n);renderPickExtras();}
 else if(a==='dent'){F.dent=b.dataset.d;F.teeth=new Set();renderPickExtras();}
 else if(a==='surf'){const s=b.dataset.s;F.surf.has(s)?F.surf.delete(s):F.surf.add(s);renderPickExtras();}
 else if(a==='remove'){S.visits=S.visits.filter(v=>v.id!==b.dataset.id);save();render();toast(t('removed'));}
 else if(a==='dup-ok'){const v=S.visits.find(x=>x.id===b.dataset.id);if(v)v.dupOk=true;save();render();}
 else if(a==='toggle'){S.open[b.dataset.d]=!S.open[b.dataset.d];save();renderPayroll();}
 else if(a==='approve'){const r=dentistRows().find(x=>x.d.id===b.dataset.d);if(r&&!r.block){S.approved[r.d.id]=r.pay;save();renderPayroll();}}
 else if(a==='unapprove'){delete S.approved[b.dataset.d];save();renderPayroll();}
 else if(a==='implant'){S.implantIdx=+b.dataset.i;save();renderFees();renderChrome();toast(t('saved'));}
 else if(a==='sample'){PASTE=SAMPLE_PASTE;$('#in-paste').value=PASTE;renderCheckOut();}
 else if(a==='clear-paste'){PASTE='';$('#in-paste').value='';renderCheckOut();}
});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(el.id==='in-patient'){F.patient=el.value;renderInsInfo();}
 else if(el.id==='in-quick'){F.quick=el.value;renderQuickPreview();}
 else if(el.id==='in-paste'){PASTE=el.value;renderCheckOut();}
});
document.addEventListener('change',ev=>{
 const el=ev.target,a=el.dataset.action;
 if(a==='dentist'){S.dentist=el.value;save();renderDentist();}
 else if(a==='date'){if(el.value>=WEEK_START&&el.value<=WEEK_END){S.date=el.value;save();renderDentist();}else el.value=S.date;}
 else if(a==='pick'){F.pick=el.value;F.teeth=new Set();F.surf=new Set();renderPickExtras();}
 else if(a==='films'){F.films=+el.value;renderPickExtras();}
 else if(a==='pa'){F.pa=Math.max(1,Math.min(18,+el.value||1));renderPickExtras();}
 else if(a==='plan'){const p=pat(el.dataset.p);if(p){p.plan=el.value||null;save();render();toast(t('planSaved',p.name,planName(p.plan)));}}
 else if(a==='fee'){const v=el.value.trim();S.fees[el.dataset.id][el.dataset.col]=v===''?null:Math.max(0,+v);save();renderChrome();toast(t('saved'));}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Enter'&&ev.target.id==='in-quick'){ev.preventDefault();$('#btn-add-quick').click();}
});

const fromHash=(location.hash||'').slice(1);
const hit=TABS.find(x=>x[1]===fromHash);
if(hit)S.tab=hit[0];
render();
})();
</script>
