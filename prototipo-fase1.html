<title>Producción Dental Delaware</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet product UI. Thin top bar with three tabs; each screen is one or two cards on a neutral ground. Lists and menus follow the command-menu pattern: grouped, compact, keyboard-first. */
:root{
  --bg:#fafafa; --surface:#ffffff; --subtle:#f4f4f5; --hover:#f4f4f5; --line:#e4e4e7; --line-2:#d4d4d8;
  --ink:#09090b; --ink-2:#3f3f46; --muted:#71717a;
  --primary:#18181b; --primary-ink:#fafafa; --primary-hover:#3f3f46;
  --ring:rgba(37,99,235,.35); --accent:#2563eb;
  --ok:#15803d; --ok-soft:#f0fdf4; --warn:#b45309; --warn-soft:#fffbeb; --bad:#b91c1c; --bad-soft:#fef2f2;
  --shadow:0 1px 2px rgba(9,9,11,.05);
  --pop-shadow:0 12px 32px -12px rgba(9,9,11,.28),0 2px 6px rgba(9,9,11,.06);
  --plate-bg:transparent; --plate-pad:0;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#111113; --subtle:#18181b; --hover:#1f1f23; --line:#27272a; --line-2:#3f3f46;
  --ink:#fafafa; --ink-2:#d4d4d8; --muted:#a1a1aa;
  --primary:#fafafa; --primary-ink:#09090b; --primary-hover:#d4d4d8;
  --ring:rgba(96,165,250,.45); --accent:#60a5fa;
  --ok:#4ade80; --ok-soft:#052e16; --warn:#fbbf24; --warn-soft:#2b1d03; --bad:#f87171; --bad-soft:#2a0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --pop-shadow:0 12px 32px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);
  --plate-bg:#ffffff; --plate-pad:4px 8px;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#111113; --subtle:#18181b; --hover:#1f1f23; --line:#27272a; --line-2:#3f3f46;
  --ink:#fafafa; --ink-2:#d4d4d8; --muted:#a1a1aa;
  --primary:#fafafa; --primary-ink:#09090b; --primary-hover:#d4d4d8;
  --ring:rgba(96,165,250,.45); --accent:#60a5fa;
  --ok:#4ade80; --ok-soft:#052e16; --warn:#fbbf24; --warn-soft:#2b1d03; --bad:#f87171; --bad-soft:#2a0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --pop-shadow:0 12px 32px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);
  --plate-bg:#ffffff; --plate-pad:4px 8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
svg.i{width:16px;height:16px;flex:none}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:56px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:22px;height:22px;color:var(--ink)}
.logo b{font-weight:600}
.logo span{font-size:12px;color:var(--muted)}
.logo.brand{gap:12px}
.logo.brand .plate{display:block;background:var(--plate-bg);padding:var(--plate-pad);border-radius:6px}
.logo.brand img{display:block;height:26px;width:auto}
.logo.brand span[data-i18n]{padding-left:12px;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;margin-left:auto;margin-right:auto;background:var(--subtle);padding:3px;border-radius:10px}
.tab{border:0;background:none;color:var(--muted);font-weight:500;font-size:13.5px;height:30px;padding:0 14px;border-radius:7px;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .cnt{font-family:var(--mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;display:inline-grid;place-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;color:var(--muted);height:28px;padding:0 9px;font-size:12px;font-weight:500}
.lang button[aria-pressed="true"]{background:var(--subtle);color:var(--ink)}
@media (max-width:760px){.top .wrap{height:auto;flex-wrap:wrap;padding-block:10px}.tabs{order:3;margin:0;width:100%;justify-content:space-between}.tab{flex:1;justify-content:center}.lang{margin-left:auto}}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-block:12px 0;font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.link{border:0;background:none;padding:0;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.link:hover{color:var(--ink)}
main{padding-block:16px 64px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.outline{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.outline:hover{background:var(--hover)}
.btn.ghost{background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
.input:focus,.cbx:focus-within{outline:none;border-color:var(--line-2);box-shadow:0 0 0 3px var(--ring)}
.input::placeholder,.cbx-in::placeholder{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{font-size:14px}
.ch .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.pill.ok{color:var(--ok)}.pill.ok::before{background:var(--ok)}
.pill.bad{color:var(--bad)}.pill.bad::before{background:var(--bad)}
.pill.warn{color:var(--warn)}.pill.warn::before{background:var(--warn)}
.seg{display:inline-flex;gap:2px;background:var(--subtle);padding:3px;border-radius:9px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button::first-letter{text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* menus and comboboxes (command-menu pattern) */
.cbx{position:relative;display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
.cbx .i{color:var(--muted)}
.cbx-in{flex:1;border:0;background:none;outline:none;min-width:0;height:100%}
.menu-wrap{position:relative;display:inline-flex}
.selbtn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px;font-weight:500;max-width:100%}
.selbtn:hover{background:var(--hover)}
.selbtn .i{color:var(--muted);width:14px;height:14px}
.selbtn.empty{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.av{width:20px;height:20px;border-radius:50%;background:var(--subtle);color:var(--ink-2);font-size:10px;font-weight:600;display:inline-grid;place-items:center;flex:none}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);padding:4px;max-height:340px;overflow-y:auto}
.pop.right{left:auto;right:0}
.pop.w260{min-width:260px}
.pop .grp{font-size:11.5px;font-weight:500;color:var(--muted);padding:8px 8px 4px}
.pop .sep{height:1px;background:var(--line);margin:4px -4px}
.opt{display:flex;align-items:center;gap:10px;min-height:32px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.opt.on{background:var(--hover)}
.opt .code{font-family:var(--mono);font-size:12px;color:var(--muted);width:46px;flex:none}
.opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .nm b{font-weight:500}
.opt .nm span{color:var(--ink-2)}
.opt .meta{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:8px}
.opt .chk{width:16px;height:16px;color:var(--ink);flex:none}
.opt.create{color:var(--ink)}
.opt.create .i{color:var(--muted)}
.pop .none{padding:10px 8px;color:var(--muted);font-size:13px}
.nm b{font-weight:600}

/* dentist */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.toolbar .grow{flex:1}
.progress{font-size:12.5px;color:var(--muted)}
.progress b{color:var(--ink);font-weight:500}
.dgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:840px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.plist{list-style:none;margin:0;padding:4px}
.prow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px}
.prow:hover{background:var(--hover)}
.prow[aria-current="true"]{background:var(--subtle);box-shadow:inset 2px 0 0 var(--ink)}
.prow .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.prow .nm{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ins{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ins.none{color:var(--bad)}
.lfoot{padding:6px 8px 8px;border-top:1px solid var(--line)}
.lfoot .btn{width:100%;justify-content:flex-start;color:var(--muted)}
.detail .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dh h2{font-size:18px;letter-spacing:-.01em}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted)}
.src{font-size:12px;color:var(--muted)}
.src.none{color:var(--bad)}
.hint{font-size:12.5px;color:var(--bad)}
.dbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) 70px auto;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.trow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .nm span{color:var(--ink-2)}
.trow .tooth{height:28px;padding:0 8px;font-family:var(--mono);font-size:12.5px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.trow .tooth:focus{outline:none;box-shadow:0 0 0 3px var(--ring);border-color:var(--line-2)}
.trow .rm{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:500;height:28px;padding:0 8px;border-radius:6px}
.trow .rm:hover{background:var(--bad-soft);color:var(--bad)}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chip:hover{background:var(--hover);color:var(--ink)}
.dmeta b{font-weight:500;color:var(--ink)}
.acts .state{margin-right:4px}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.tags{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
@media (max-width:520px){.trow .nm{white-space:normal}}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.state{font-size:12.5px;color:var(--muted)}
.state.ok{color:var(--ok)}
.blank{padding:56px 20px;text-align:center;color:var(--muted)}

/* summary */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.ph h1{font-size:20px;letter-spacing:-.01em}
.ph .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ph .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:640px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:14px 16px}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.kpi.bad b{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:16px}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th.num{text-align:right;font-family:var(--font)}
.t td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tfoot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600}
.exp{border:0;background:none;display:inline-flex;align-items:center;gap:8px;padding:0;font-weight:500}
.exp .i{color:var(--muted);transition:transform .15s}
.exp[aria-expanded="true"] .i{transform:rotate(90deg)}
.t > tbody > tr.detail > td{background:var(--subtle);padding:0}
.inner{width:100%;border-collapse:collapse;font-size:13px}
.inner td{padding:8px 16px;border-bottom:1px solid var(--line)}
.inner tr:last-child td{border-bottom:0}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.alerts li:first-child{border-top:0}
.alerts .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.alerts .what span{font-size:12.5px;color:var(--muted)}
.clear{padding:16px;color:var(--ok);font-weight:500}

/* fees */
.ftools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ftools .cbx{width:260px;height:32px}
.ftools .grow{flex:1}
.raise{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.raise input{width:64px;height:30px;text-align:right;font-family:var(--mono)}
table.fees{width:100%;border-collapse:collapse;font-size:13px}
.fees thead th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.fees thead th.num{text-align:right;padding-right:16px;font-family:var(--font)}
.fees td{padding:2px 8px;border-bottom:1px solid var(--line);height:36px;vertical-align:middle}
.fees td.code{font-family:var(--mono);font-size:12px;color:var(--muted);padding-left:16px;white-space:nowrap}
.fees td.nm{min-width:240px}
.fees td.nm span{color:var(--ink-2)}
.fees tr.grp td{background:var(--subtle);font-size:11.5px;font-weight:500;color:var(--muted);height:30px;padding-left:16px}
.fees input{width:84px;height:28px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:right;font-family:var(--mono);font-size:12.5px;padding:0 8px}
.fees input:hover{border-color:var(--line)}
.fees input:focus{outline:none;border-color:var(--line-2);background:var(--surface);box-shadow:0 0 0 3px var(--ring)}
.fees .ro{display:inline-block;width:84px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-right:8px}
.newtag{font-size:10.5px;font-weight:500;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.combos{list-style:none;margin:0;padding:0}
.combos li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
.combos li:first-child{border-top:0}
.combos .codes{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(9,9,11,.45);z-index:60}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop-shadow);z-index:61}
.dlg .dhd{padding:18px 20px 6px}
.dlg h3{font-size:16px}
.dlg .ddesc{font-size:13px;color:var(--muted);margin-top:4px}
.dlg .dbd{padding:12px 20px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:12.5px;font-weight:500}
.f .help{font-size:12px;color:var(--muted)}
.f .err{font-size:12px;color:var(--bad)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.row2,.row3{grid-template-columns:minmax(0,1fr)}}
.catchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--subtle);font-size:12px;color:var(--ink-2);align-self:flex-start}
.preview{padding:10px 12px;border-radius:8px;background:var(--subtle);font-size:13px}
.preview .code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
.fee-in label{font-size:11.5px;color:var(--muted);font-weight:500}
.fee-in .input{height:32px;font-family:var(--mono);text-align:right}
.dft{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--primary);color:var(--primary-ink);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k,...a){const v=T[S.lang][k];return typeof v==='function'?v(...a):(v??k);}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const sum=a=>a.reduce((x,y)=>x+y,0);
const money=v=>{if(v==null)return '—';if(S.lang==='es'){const [i,d]=v.toFixed(2).split('.');return (i.length>4?i.replace(/\B(?=(\d{3})+(?!\d))/g,' '):i)+','+d+' $';}return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);};
const fmtFee=v=>v==null||v===''?'':(S.lang==='es'?Number(v).toFixed(2).replace('.',','):Number(v).toFixed(2));
const parseFee=s=>{const x=String(s||'').trim().replace(/\s/g,'').replace(',','.');if(x==='')return null;const n=Number(x);return isNaN(n)?undefined:Math.round(Math.max(0,n)*100)/100;};
const fmtDate=(iso,o)=>new Date(iso+'T12:00:00').toLocaleDateString(t('locale'),o||{weekday:'short',month:'short',day:'numeric'});
const fmtTime=s=>{const [h,m]=String(s).split(':');return new Date(2026,0,1,+h,+m).toLocaleTimeString(t('locale'),{hour:'numeric',minute:'2-digit'});};
const pat=id=>S.patients.find(p=>p.id===id);
const dname=id=>S.dentists.find(d=>d.id===id).name;
const initials=name=>{const [l,f]=String(name).split(',').map(x=>(x||'').trim());return ((f||'')[0]||'')+((l||'')[0]||'');};
const dInitials=name=>name.split(' ').map(w=>w[0]).slice(0,2).join('');
const catalog=()=>BASE.concat(S.custom);
const entry=id=>catalog().find(e=>e.id===id);
const parts=e=>e?(e[S.lang]||e.en):[];
const nameHTML=e=>{const p=parts(e);return `<b>${esc(p[0]||'')}</b>${p.slice(1).map(x=>`<span> · ${esc(x)}</span>`).join('')}`;};
const nameText=e=>parts(e).join(' · ');
const needsTooth=e=>{const c=catOf(e&&e.code);return !!c&&TOOTH_CATS.has(c.id);};
const allPlans=()=>PD.PLAN_ORDER.map(k=>({id:k,name:PD.PLANS[k][S.lang].replace(/\s*\(.*\)$/,''),col:PD.PLANS[k].col})).concat(S.customPlans);
const planInfo=k=>allPlans().find(p=>p.id===k);
const colName=c=>c?PD.COL_NAMES[c]:'—';
const dayKey=(d,date)=>d+'|'+date;
const isSent=v=>!!S.sent[dayKey(v.dentist,v.date)];

/* ---------- pricing ---------- */
function engineItems(items){
 const out=[];let pa=0,btw=0;
 items.forEach(x=>{const e=entry(x.id);if(!e){out.push({k:'other'});return;}const it=e.item;
  if(it==='pa'||it==='paadd'){pa++;return;}
  if(/^btw\d$/.test(it)){btw=Math.min(4,btw+ +it.slice(3));return;}
  out.push({k:it,tooth:x.tooth});});
 if(btw)out.push({k:'btw',n:btw});
 if(pa)out.push({k:'pa',n:pa});
 return out;
}
function evalVisit(v){
 const p=pat(v.patient);const pl=p&&p.plan?planInfo(p.plan):null;
 const planKey=pl?(PD.PLANS[pl.id]?pl.id:PLAN_FOR_COL[pl.col]):null;
 const r=PD.priceVisit(engineItems(v.items),planKey,{fees:S.fees,implantIdx:S.implantIdx});
 r.blocking=r.alerts.filter(a=>BLOCKING.has(a)).length;
 return r;
}
// Why a visit can't be paid yet. Unpaid visits stay in the period until these are cleared, so nothing is forgotten.
function holds(v,e){const r=isSent(v)?[]:['notSent'];e.alerts.forEach(a=>{if(BLOCKING.has(a))r.push(a==='notInTable'?'noPrice':a);});return [...new Set(r)];}
function periodRows(){return S.visits.filter(v=>v.items.length&&(v.paid===PERIOD.id||(!v.paid&&v.date<=PERIOD.to))).map(v=>{const e=evalVisit(v);return {v,e,hold:v.paid?[]:holds(v,e)};});}
function insQueue(){return S.visits.filter(v=>v.items.length&&isSent(v)&&!v.paid&&!pat(v.patient).plan).sort((a,b)=>a.date.localeCompare(b.date));}
const holdLabel=h=>t(h==='notSent'?'h_notSent':h==='noIns'?'h_noIns':'h_noFee');

let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}
function focusId(id){requestAnimationFrame(()=>{const el=document.getElementById(id);if(el)el.focus();});}

/* ---------- comboboxes ---------- */
function scoreEntry(e,q){
 if(!q)return 1;
 const code=norm(e.code);if(code===q)return 100;if(code.startsWith(q))return 80;
 const hay=norm([e.code].concat(e.en,e.es).join(' '));const toks=q.split(/\s+/).filter(Boolean);
 if(!toks.every(tk=>hay.includes(tk)))return 0;
 return 40+(norm(parts(e)[0]).startsWith(toks[0])?10:0);
}
function buildPop(key){
 OPTS=[];let h='';
 if(key==='treat'){
  const q=norm($('#treat-q').value.trim());
  const hits=catalog().map(e=>({e,s:scoreEntry(e,q)})).filter(x=>x.s>0);
  const order=CATS.map(c=>c.id);
  const byCat={};hits.forEach(x=>{const c=catOf(x.e.code);const k=c?c.id:'adj';(byCat[k]=byCat[k]||[]).push(x);});
  const groups=order.filter(k=>byCat[k]).map(k=>({k,items:byCat[k].sort((a,b)=>b.s-a.s||a.e.code.localeCompare(b.e.code))}));
  if(q)groups.sort((a,b)=>Math.max(...b.items.map(x=>x.s))-Math.max(...a.items.map(x=>x.s)));
  groups.forEach((g,gi)=>{const c=CATS.find(x=>x.id===g.k);if(gi)h+='<div class="sep"></div>';h+=`<div class="grp">${esc(c[S.lang])}</div>`;g.items.forEach(x=>{OPTS.push({kind:'treat',id:x.e.id});h+=optHTML(OPTS.length-1,`<span class="code">${esc(x.e.code)}</span><span class="nm">${nameHTML(x.e)}</span>`);});});
  if(!hits.length)h+=`<div class="none">${t('noMatch')}</div>`;
  h+='<div class="sep"></div>';OPTS.push({kind:'create'});h+=optHTML(OPTS.length-1,`${svg('plus')}<span class="nm">${esc(t('createTreat',$('#treat-q').value.trim()))}</span>`,'create');
 }else if(key==='pat'){
  const raw=$('#pat-q').value.trim(),q=norm(raw);
  const onDay=new Set(S.visits.filter(v=>v.dentist===S.dentist&&v.date===S.date).map(v=>v.patient));
  const hits=S.patients.filter(p=>!onDay.has(p.id)&&(!q||norm(p.name).includes(q))).slice(0,8);
  if(hits.length){h+=`<div class="grp">${t('patGroup')}</div>`;hits.forEach(p=>{OPTS.push({kind:'pat',id:p.id});h+=optHTML(OPTS.length-1,`<span class="av">${esc(initials(p.name))}</span><span class="nm">${esc(p.name)}</span>`);});}
  h+='<div class="sep"></div>';
  if(raw){OPTS.push({kind:'newpat',name:raw});h+=optHTML(OPTS.length-1,`${svg('plus')}<span class="nm">${esc(t('patCreate',raw))}</span>`,'create');}
  else h+=`<div class="none">${t('patTypeToCreate')}</div>`;
 }else if(key==='family'){
  const raw=$('#dlg-family').value.trim(),q=norm(raw);
  const code=($('#dlg-code').value||'').trim().toUpperCase();const cat=catOf(code);
  const fams={};catalog().forEach(e=>{const f=parts(e)[0];if(!f)return;const c=catOf(e.code);(fams[f]=fams[f]||new Set()).add(c?c.id:'');});
  let list=Object.keys(fams).filter(f=>!q||norm(f).includes(q));
  list.sort((a,b)=>((cat&&fams[b].has(cat.id))?1:0)-((cat&&fams[a].has(cat.id))?1:0)||a.localeCompare(b));
  if(list.length){h+=`<div class="grp">${t('famExisting')}</div>`;list.slice(0,8).forEach(f=>{OPTS.push({kind:'fam',val:f});const cs=[...fams[f]].map(id=>{const c=CATS.find(x=>x.id===id);return c?c[S.lang]:'';}).filter(Boolean).join(', ');h+=optHTML(OPTS.length-1,`<span class="nm"><b>${esc(f)}</b></span><span class="meta">${esc(cs)}</span>`);});}
  if(raw&&!Object.keys(fams).some(f=>norm(f)===q)){if(list.length)h+='<div class="sep"></div>';OPTS.push({kind:'fam',val:raw});h+=optHTML(OPTS.length-1,`${svg('plus')}<span class="nm">${esc(t('famNew',raw))}</span>`,'create');}
  if(!OPTS.length)return '';
 }
 if(ACT>=OPTS.length)ACT=0;
 return h;
}
function optHTML(i,inner,cls){return `<div class="opt ${cls||''} ${i===ACT?'on':''}" role="option" id="opt-${i}" data-opt="${i}" aria-selected="${i===ACT}">${inner}</div>`;}
function refreshPop(key){
 const el=document.getElementById('pop-'+key);if(!el)return;
 const open=OPEN===key;const html=open?buildPop(key):'';
 el.hidden=!open||!html;el.innerHTML=html;
 const inp=document.querySelector(`[data-cbx="${key}"]`);if(inp){inp.setAttribute('aria-expanded',String(open&&!!html));if(open&&OPTS.length)inp.setAttribute('aria-activedescendant','opt-'+ACT);else inp.removeAttribute('aria-activedescendant');}
 const on=el.querySelector('.opt.on');if(on)on.scrollIntoView({block:'nearest'});
}
function runOpt(i){
 const o=OPTS[i];if(!o)return;
 if(o.kind==='treat'){const v=curVisit();if(!v)return;const e=entry(o.id);v.items.push({id:o.id});save();OPEN=null;$('#treat-q').value='';renderShell();renderDentist();if(needsTooth(e))focusId('tooth-'+(v.items.length-1));else focusId('treat-q');}
 else if(o.kind==='create'){const q=$('#treat-q').value.trim();OPEN=null;refreshPop('treat');openTreatDialog(q,'visit');}
 else if(o.kind==='pat'){addPatientVisit(pat(o.id));}
 else if(o.kind==='newpat'){const p={id:'p'+(S.nextPat++),name:o.name,plan:null,src:null};S.patients.push(p);addPatientVisit(p);}
 else if(o.kind==='fam'){$('#dlg-family').value=o.val;OPEN=null;refreshPop('family');updateDialog();focusId('dlg-variant');}
}

/* ---------- review: Javier's sign-off ---------- */
function missingLists(){const m=[];S.dentists.forEach(d=>DAYS.forEach(day=>{if(!S.sent[dayKey(d.id,day)])m.push({d,day});}));return m;}
function renderSummary(){
 const all=periodRows();
 const hold=all.filter(r=>r.hold.length),toApprove=all.filter(r=>!r.hold.length&&!r.v.paid);
 const rows=S.dentists.map(d=>{const mine=all.filter(r=>r.v.dentist===d.id).sort((a,b)=>a.v.date.localeCompare(b.v.date));const ok=mine.filter(r=>!r.hold.length);return {d,mine,pay:Math.round(sum(ok.map(r=>r.e.total||0))*100)/100,visits:ok.length,hold:mine.length-ok.length};});
 const total=sum(rows.map(r=>r.pay));
 const short=iso=>fmtDate(iso,{weekday:'short',day:'numeric'});
 const missing=missingLists(),totalLists=S.dentists.length*DAYS.length;
 const noIns=new Set(hold.filter(r=>r.hold.includes('noIns')).map(r=>r.v.patient)).size;
 const noFee=hold.filter(r=>r.hold.includes('noPrice')).length;
 const chk=(ok,label,sub,act)=>`<li><div class="what"><span class="pill ${ok?'ok':'bad'}"><span style="color:var(--ink);font-weight:500;font-size:13.5px">${esc(label)}</span></span>${sub?`<span>${esc(sub)}</span>`:''}</div>${ok?'':act}</li>`;
 const tags=r=>[r.v.date<PERIOD.from?`<span class="tag">${esc(t('h_carried',fmtDate(r.v.date,{month:'short',day:'numeric'})))}</span>`:'',r.v.paid?`<span class="tag">${t('h_paid')}</span>`:'',...r.hold.map(h=>`<span class="tag bad">${esc(holdLabel(h))}</span>`)].join('');
 const acts=S.approved&&!toApprove.length
  ?`<span class="state ok">✓ ${t('approved')}</span><button type="button" class="btn outline" data-action="adp">${svg('copy')}${t('copyAgain')}</button>`
  :`<button type="button" class="btn primary" data-action="approve" ${toApprove.length?'':'disabled'}>${svg('check')}${S.approved?t('approveMore',toApprove.length):t('approve')}</button>`;
 $('#main').innerHTML=`
 <div class="ph"><div><h1>${t('sumTitle')}</h1><div class="sub">${t('sumRange')}</div></div><div class="acts">${acts}</div></div>
 <div class="kpis">
  <div class="card kpi"><span>${t('k_total')}</span><b>${money(total)}</b></div>
  <div class="card kpi"><span>${t('k_visits')}</span><b>${sum(rows.map(r=>r.visits))}</b></div>
  <div class="card kpi ${hold.length?'bad':''}"><span>${t('k_hold')}</span><b>${hold.length}</b></div>
 </div>
 <div class="stack">
 <section class="card"><div class="ch"><h2>${t('checkTitle')}</h2></div><ul class="alerts">
  ${chk(!missing.length,t('c_lists',totalLists-missing.length,totalLists),missing.map(m=>m.d.name+' · '+short(m.day)).join(', '),`<button type="button" class="btn outline sm" data-action="remind-all">${t('remindAll')}</button>`)}
  ${chk(!noIns,t('c_ins',noIns),'',`<button type="button" class="btn outline sm" data-action="page" data-page="insurance">${t('goIns')}</button>`)}
  ${chk(!noFee,t('c_fee',noFee),'',`<button type="button" class="btn outline sm" data-action="page" data-page="fees">${t('goFees')}</button>`)}
 </ul><div class="cfoot"><span class="muted">${t('holdNote')}</span></div></section>
 <section class="card"><div class="tablewrap"><table class="t"><thead><tr><th>${t('colDentist')}</th><th class="num">${t('colVisits')}</th><th class="num">${t('colPay')}</th><th>${t('colHold')}</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td><button type="button" class="exp" data-action="toggle" data-d="${r.d.id}" aria-expanded="${!!S.open[r.d.id]}">${svg('chevR')}<span class="av">${esc(dInitials(r.d.name))}</span>${esc(r.d.name)}</button></td><td class="num">${r.visits}</td><td class="num">${money(r.pay)}</td><td>${r.hold?`<span class="pill bad">${r.hold}</span>`:`<span class="pill ok">0</span>`}</td></tr>
  ${S.open[r.d.id]?`<tr class="detail"><td colspan="4"><div class="tablewrap"><table class="inner"><tbody>${r.mine.map(x=>{const p=pat(x.v.patient);return `<tr><td class="mono muted" style="white-space:nowrap">${esc(short(x.v.date))}</td><td>${esc(p.name)} <span class="tags">${tags(x)}</span></td><td class="mono muted" style="font-size:12px">${esc(x.v.items.map(it=>{const en=entry(it.id);return (en?en.code:'?')+(it.tooth?' #'+it.tooth:'');}).join(', '))}</td><td class="muted">${esc(p.plan?planInfo(p.plan).name:'—')}</td><td class="num">${x.hold.length?'—':money(x.e.total)}</td></tr>`;}).join('')}</tbody></table></div></td></tr>`:''}`).join('')}
 </tbody><tfoot><tr><td>${t('total')}</td><td class="num">${sum(rows.map(r=>r.visits))}</td><td class="num">${money(total)}</td><td></td></tr></tfoot></table></div></section>
 </div>`;
}
function copyADP(msg){
 const lines=['Dentist\tPay period\tAmount'];
 S.dentists.forEach(d=>{const tot=sum(S.visits.filter(v=>v.dentist===d.id&&v.paid===PERIOD.id).map(v=>evalVisit(v).total||0));lines.push(`${d.name}\t${PERIOD.adp}\t${tot.toFixed(2)}`);});
 const ok=()=>toast(msg);try{navigator.clipboard.writeText(lines.join('\n')).then(ok,ok);}catch(e){ok();}
}

/* ---------- fees ---------- */
function renderFees(){
 const q=norm(FEEQ.trim());
 const rows=catalog().filter(e=>!q||norm([e.code].concat(e.en,e.es).join(' ')).includes(q)).sort((a,b)=>a.code.localeCompare(b.code));
 const seen={};let body='',lastCat=null;
 rows.forEach(e=>{
  const c=catOf(e.code);const cid=c?c.id:'';
  if(cid!==lastCat){lastCat=cid;body+=`<tr class="grp"><td colspan="${2+PD.COLS.length}">${esc(c?c[S.lang]:'')}</td></tr>`;}
  const first=seen[e.item];if(!first)seen[e.item]=e.code;
  const cells=PD.COLS.map(col=>{const v=S.fees[e.item]?S.fees[e.item][col]:null;
   if(first)return `<td class="num"><span class="ro" title="${esc(t('sameAs',first))}">${v==null?'—':Array.isArray(v)?v.map(fmtFee).join(' / '):fmtFee(v)}</span></td>`;
   if(Array.isArray(v))return `<td class="num"><span class="ro">${v.map(fmtFee).join(' / ')}</span></td>`;
   return `<td class="num"><input type="text" inputmode="decimal" data-f="fee" data-k="${esc(e.item)}" data-col="${col}" value="${fmtFee(v)}" placeholder="—" aria-label="${esc(e.code+' '+nameText(e)+' · '+PD.COL_NAMES[col])}"></td>`;}).join('');
  body+=`<tr><td class="code">${esc(e.code)}</td><td class="nm">${nameHTML(e)}${e.custom?`<span class="newtag">${t('newTag')}</span>`:''}</td>${cells}</tr>`;
 });
 const comboCodes=b=>{const c=[{comp:'D0150',periodic:'D0120',limited:'D0140'}[b.exam]];if(b.pan)c.push('D0330');if(b.btw)c.push(b.btw===4?'D0274':'D0272');if(b.pa)c.push(b.pa>1?`D0220 + ${b.pa-1}× D0230`:'D0220');if(b.fms)c.push('D0210');if(b.rec)c.push('D2920');return c.join(' + ');};
 $('#main').innerHTML=`
 <div class="ph"><div><h1>${t('feesTitle')}</h1><div class="sub">${t('feesSub')}</div></div><div class="acts"><button type="button" class="btn outline" data-action="new-plan">${svg('plus')}${t('newPlan')}</button><button type="button" class="btn primary" data-action="new-treat">${svg('plus')}${t('newTreat')}</button></div></div>
 <div class="stack">
 <section class="card">
  <div class="ftools"><div class="cbx">${svg('search')}<input type="text" id="fees-q" class="cbx-in" autocomplete="off" placeholder="${esc(t('feesFilter'))}" value="${esc(FEEQ)}" aria-label="${esc(t('feesFilter'))}"></div><span class="grow"></span><label class="raise" for="raise">${t('raise')} <input type="number" id="raise" class="input" min="0" max="50" step="0.5" value="2"> %</label><button type="button" class="btn outline sm" data-action="raise">${t('raiseBtn')}</button></div>
  <div class="tablewrap" style="max-height:620px;overflow:auto"><table class="fees"><thead><tr><th style="padding-left:16px">${t('colCode')}</th><th>${t('colTreat')}</th>${PD.COLS.map(c=>`<th class="num">${esc(PD.COL_NAMES[c])}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
 </section>
 <section class="card"><div class="ch"><h2>${t('combosTitle')}</h2><span class="sub">${t('combosSub')}</span></div>
  <ul class="combos">${PD.BUNDLES.map(b=>`<li><span class="codes">${esc(comboCodes(b))}</span><span>${esc(PD.ITEM[b.id][S.lang])}</span></li>`).join('')}</ul>
  <div class="cfoot"><span>${t('implantRule')}</span><div class="seg" role="group">${[0,1].map(i=>`<button type="button" data-action="implant" data-i="${i}" aria-pressed="${S.implantIdx===i}">${money([508.4,406.4][i])}</button>`).join('')}</div></div>
  <div class="cfoot"><span>${t('history')}</span><span class="muted">${S.history.length?S.history.map(esc).join(' · '):t('noHistory')}</span></div>
 </section>
 </div>`;
}

/* ---------- dialogs ---------- */
function openTreatDialog(q,from){
 const code=/^d\d{1,4}$/i.test(q||'')?q.toUpperCase():'';
 DIALOG={type:'treat',from,code,family:code?'':(q||''),variant:'',detail:''};renderDialog();focusId(code&&code.length===5?'dlg-family':'dlg-code');
}
function renderDialog(){
 const L=$('#layer');
 if(!DIALOG){L.innerHTML='';return;}
 if(DIALOG.type==='treat'){
  L.innerHTML=`<div class="scrim" data-action="dlg-close"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
   <div class="dhd"><h3 id="dlg-title">${t('dlgTreat')}</h3><p class="ddesc">${t('dlgTreatDesc')}</p></div>
   <div class="dbd">
    <div class="row2"><div class="f"><label for="dlg-code">${t('f_code')}</label><input type="text" id="dlg-code" class="input mono" maxlength="5" placeholder="D0000" value="${esc(DIALOG.code)}" autocomplete="off"><span class="err" id="dlg-code-err"></span></div>
     <div class="f"><label>${t('f_category')}</label><span class="catchip" id="dlg-cat"></span></div></div>
    <div class="f"><label for="dlg-family">${t('f_family')}</label><div class="cbx"><input type="text" id="dlg-family" class="cbx-in" data-cbx="family" autocomplete="off" placeholder="${esc(t('f_familyPh'))}" value="${esc(DIALOG.family)}" role="combobox" aria-expanded="false" aria-controls="pop-family" aria-autocomplete="list"><div class="pop" id="pop-family" role="listbox" hidden></div></div><span class="err" id="dlg-fam-err"></span></div>
    <div class="row2"><div class="f"><label for="dlg-variant">${t('f_variant')} <span class="muted">· ${t('f_optional')}</span></label><input type="text" id="dlg-variant" class="input" placeholder="${esc(t('f_variantPh'))}" value="${esc(DIALOG.variant)}" autocomplete="off"></div>
     <div class="f"><label for="dlg-detail">${t('f_detail')} <span class="muted">· ${t('f_optional')}</span></label><input type="text" id="dlg-detail" class="input" placeholder="${esc(t('f_detailPh'))}" value="${esc(DIALOG.detail)}" autocomplete="off"></div></div>
    <div class="f"><label>${t('f_preview')}</label><div class="preview" id="dlg-preview"></div></div>
    <div class="f"><label>${t('f_fees')}</label><div class="row3">${PD.COLS.map(c=>`<div class="f fee-in"><label for="dlg-fee-${c}">${esc(PD.COL_NAMES[c])}</label><input type="text" inputmode="decimal" id="dlg-fee-${c}" class="input" placeholder="—"></div>`).join('')}</div><span class="help">${t('f_feesHelp')}</span></div>
   </div>
   <div class="dft"><button type="button" class="btn outline" data-action="dlg-close">${t('f_cancel')}</button><button type="button" class="btn primary" data-action="dlg-create">${t('f_create')}</button></div></div>`;
  updateDialog();
 }else if(DIALOG.type==='plan'){
  L.innerHTML=`<div class="scrim" data-action="dlg-close"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width:min(420px,calc(100% - 32px))">
   <div class="dhd"><h3 id="dlg-title">${t('dlgPlan')}</h3><p class="ddesc">${t('dlgPlanDesc')}</p></div>
   <div class="dbd"><div class="f"><label for="dlg-plan">${t('f_planName')}</label><input type="text" id="dlg-plan" class="input" placeholder="${esc(t('f_planPh'))}" autocomplete="off"><span class="err" id="dlg-plan-err"></span></div>
    <div class="f"><label>${t('f_paysLike')}</label><div class="seg" role="group" style="flex-wrap:wrap">${PD.COLS.map(c=>`<button type="button" data-action="dlg-col" data-col="${c}" aria-pressed="${DIALOG.col===c}">${esc(PD.COL_NAMES[c])}</button>`).join('')}</div></div></div>
   <div class="dft"><button type="button" class="btn outline" data-action="dlg-close">${t('f_cancel')}</button><button type="button" class="btn primary" data-action="dlg-plan-create">${t('f_createPlan')}</button></div></div>`;
 }
}
function dialogValues(){return {code:($('#dlg-code').value||'').trim().toUpperCase(),family:($('#dlg-family').value||'').trim(),variant:($('#dlg-variant').value||'').trim(),detail:($('#dlg-detail').value||'').trim()};}
function updateDialog(){
 if(!DIALOG||DIALOG.type!=='treat')return;
 const v=dialogValues();Object.assign(DIALOG,v);
 const cat=catOf(v.code);
 $('#dlg-cat').textContent=cat?`${cat[S.lang]} · D${String(cat.a).padStart(4,'0')}–D${cat.b}`:t('f_catWait');
 const dup=/^D\d{4}$/.test(v.code)?catalog().find(e=>e.code===v.code):null;
 $('#dlg-code-err').textContent=dup?t('e_dup',v.code,nameText(dup)):'';
 const nm=[v.family,v.variant,v.detail].filter(Boolean);
 $('#dlg-preview').innerHTML=`<span class="code">${esc(v.code||'D0000')}</span>${nm.length?`<b>${esc(nm[0])}</b>${nm.slice(1).map(x=>`<span> · ${esc(x)}</span>`).join('')}`:'<span class="muted">…</span>'}${cat?` <span class="muted">· ${esc(cat[S.lang])}</span>`:''}`;
}
function createTreatment(){
 const v=dialogValues();let bad=false;
 if(!/^D\d{4}$/.test(v.code)){$('#dlg-code-err').textContent=t('e_code');bad=true;}
 else if(catalog().some(e=>e.code===v.code)){bad=true;}
 if(!v.family){$('#dlg-fam-err').textContent=t('e_family');bad=true;}else $('#dlg-fam-err').textContent='';
 if(bad)return;
 const nm=[v.family,v.variant,v.detail].filter(Boolean);
 const key='x_'+v.code;
 S.fees[key]={};PD.COLS.forEach(c=>{const x=parseFee($('#dlg-fee-'+c).value);S.fees[key][c]=x===undefined?null:x;});
 const e={id:v.code+'-'+key,code:v.code,item:key,en:nm,es:nm,custom:true};
 S.custom.push(e);
 const from=DIALOG.from;DIALOG=null;OPEN=null;
 if(from==='visit'){const cv=curVisit();if(cv)cv.items.push({id:e.id});}
 save();render();toast(t('created',v.code));
 if(from==='visit'&&needsTooth(e)){const cv=curVisit();focusId('tooth-'+(cv.items.length-1));}
}

/* ---------- events ---------- */
function closeMenus(){document.querySelectorAll('.menu-wrap .pop').forEach(p=>p.remove());document.querySelectorAll('.menu-wrap [aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));}
document.addEventListener('mousedown',ev=>{
 const o=ev.target.closest('.opt[data-opt]');
 if(o){ev.preventDefault();ACT=+o.dataset.opt;runOpt(ACT);return;}
 const ci=ev.target.closest('input[data-cbx]');
 if(ci){const k=ci.dataset.cbx;if(OPEN&&OPEN.startsWith('menu:'))closeMenus();if(OPEN!==k){const was=OPEN;OPEN=k;ACT=0;if(was&&!was.startsWith('menu:'))refreshPop(was);setTimeout(()=>refreshPop(k));}return;}
 if(OPEN&&!ev.target.closest('.cbx,.menu-wrap')){
  const was=OPEN;OPEN=null;
  if(was.startsWith('menu:'))closeMenus();else refreshPop(was);
 }
});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='lang'){S.lang=b.dataset.lang;save();render();}
 else if(a==='page'){S.page=b.dataset.page;OPEN=null;ADDING=false;save();render();try{history.replaceState(null,'','#'+S.page);}catch(e){}window.scrollTo(0,0);}
 else if(a==='reset'){const lang=S.lang,page=S.page;S=seed();S.lang=lang;S.page=page;OPEN=null;ADDING=false;DIALOG=null;save();render();toast(t('resetDone'));}
 else if(a==='menu'){const k=b.dataset.key;OPEN=OPEN===k?null:k;rerenderPage();}
 else if(a==='plan-pick'){const p=pat(b.dataset.p);OPEN=null;setPlan(p,b.dataset.val);renderShell();rerenderPage();}
 else if(a==='dentist-pick'){S.dentist=b.dataset.val;S.sel=null;OPEN=null;ADDING=false;save();renderDentist();}
 else if(a==='day'){S.date=b.dataset.d;S.sel=null;ADDING=false;save();rerenderPage();}
 else if(a==='sel'){S.sel=b.dataset.v;OPEN=null;save();renderDentist();if(matchMedia('(max-width:840px)').matches)$('#detail').scrollIntoView({block:'start'});}
 else if(a==='add-patient'){ADDING=true;ACT=0;renderDentist();focusId('pat-q');}
 else if(a==='quick'){const v=curVisit();if(!v)return;QUICK[+b.dataset.i].ids.forEach(id=>v.items.push({id}));save();renderShell();renderDentist();focusId('treat-q');}
 else if(a==='rm'){const v=curVisit();v.items.splice(+b.dataset.i,1);save();renderShell();renderDentist();}
 else if(a==='send-list'){const n=dayVisits().filter(v=>v.items.length).length;if(!n){toast(t('sendEmpty'));return;}const d=new Date();S.sent[dayKey(S.dentist,S.date)]=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');save();renderShell();renderDentist();toast(t('listSent',n));}
 else if(a==='remind'){toast(t('reminded',dname(b.dataset.d)));}
 else if(a==='remind-all'){toast(t('remindedAll',new Set(missingLists().map(m=>m.d.id)).size));}
 else if(a==='toggle'){S.open[b.dataset.d]=!S.open[b.dataset.d];save();renderSummary();}
 else if(a==='approve'){periodRows().filter(r=>!r.hold.length&&!r.v.paid).forEach(r=>{r.v.paid=PERIOD.id;});S.approved=new Date().toISOString().slice(0,10);save();renderShell();renderSummary();copyADP(t('approvedToast'));}
 else if(a==='adp'){copyADP(t('copied'));}
 else if(a==='new-treat'){openTreatDialog('','fees');}
 else if(a==='new-plan'){DIALOG={type:'plan',col:'nin'};renderDialog();focusId('dlg-plan');}
 else if(a==='dlg-close'){DIALOG=null;OPEN=null;renderDialog();}
 else if(a==='dlg-create'){createTreatment();}
 else if(a==='dlg-col'){DIALOG.col=b.dataset.col;const nm=$('#dlg-plan').value;renderDialog();$('#dlg-plan').value=nm;}
 else if(a==='dlg-plan-create'){const name=$('#dlg-plan').value.trim();if(!name){$('#dlg-plan-err').textContent=t('e_plan');return;}S.customPlans.push({id:'cp'+(S.customPlans.length+1),name,col:DIALOG.col});DIALOG=null;save();render();toast(t('planAdded',name));}
 else if(a==='raise'){const p=+$('#raise').value;if(!(p>0))return;const f=1+p/100;Object.values(S.fees).forEach(row=>Object.keys(row).forEach(c=>{const v=row[c];if(Array.isArray(v))row[c]=v.map(x=>Math.round(x*f*100)/100);else if(typeof v==='number'&&v>0)row[c]=Math.round(v*f*100)/100;}));S.history.unshift(`+${p}% · ${new Date().toLocaleDateString(t('locale'))}`);save();render();toast(t('raised',p));}
 else if(a==='implant'){S.implantIdx=+b.dataset.i;save();render();toast(t('savedFee'));}
});
document.addEventListener('focusin',ev=>{const k=ev.target.dataset&&ev.target.dataset.cbx;if(k&&k!=='treat'&&OPEN!==k){if(OPEN&&OPEN.startsWith('menu:'))closeMenus();OPEN=k;ACT=0;refreshPop(k);}});
document.addEventListener('input',ev=>{
 const el=ev.target;const k=el.dataset&&el.dataset.cbx;
 if(k){OPEN=k;ACT=0;refreshPop(k);if(k==='family')updateDialog();return;}
 if(el.id==='fees-q'){FEEQ=el.value;const pos=el.selectionStart;renderFees();const n=$('#fees-q');n.focus();n.setSelectionRange(pos,pos);return;}
 if(DIALOG&&DIALOG.type==='treat'&&el.closest('.dlg'))updateDialog();
});
document.addEventListener('keydown',ev=>{
 const el=ev.target;const k=el.dataset&&el.dataset.cbx;
 if(k&&OPEN!==k&&(ev.key==='ArrowDown'||ev.key==='Enter')){ev.preventDefault();OPEN=k;ACT=0;refreshPop(k);return;}
 if(k&&OPEN===k){
  if(ev.key==='ArrowDown'){ev.preventDefault();if(OPTS.length){ACT=(ACT+1)%OPTS.length;refreshPop(k);}return;}
  if(ev.key==='ArrowUp'){ev.preventDefault();if(OPTS.length){ACT=(ACT-1+OPTS.length)%OPTS.length;refreshPop(k);}return;}
  if(ev.key==='Enter'){ev.preventDefault();if(OPTS.length)runOpt(ACT);return;}
  if(ev.key==='Escape'){ev.preventDefault();OPEN=null;refreshPop(k);if(k==='pat'){ADDING=false;renderDentist();}return;}
 }
 if(ev.key==='Escape'){if(OPEN){OPEN=null;rerenderPage();return;}if(DIALOG){DIALOG=null;renderDialog();return;}}
 if(ev.key==='Enter'&&el.dataset&&el.dataset.f==='tooth'){ev.preventDefault();el.blur();focusId('treat-q');}
 if(ev.key==='Enter'&&el.id==='dlg-plan'){ev.preventDefault();$('[data-action="dlg-plan-create"]').click();}
});
document.addEventListener('change',ev=>{
 const el=ev.target,f=el.dataset.f;
 if(f==='tooth'){const v=curVisit();const s=el.value.trim().toUpperCase().replace(/^#/,'');if(s)v.items[+el.dataset.i].tooth=s;else delete v.items[+el.dataset.i].tooth;save();}
 else if(f==='fee'){const v=parseFee(el.value);const row=S.fees[el.dataset.k];if(v===undefined){el.value=fmtFee(row[el.dataset.col]);return;}row[el.dataset.col]=v;el.value=fmtFee(v);save();renderShell();toast(t('savedFee'));}
});

const h=(location.hash||'').slice(1);if(PAGES.includes(h))S.page=h;
render();
})();
</script>
